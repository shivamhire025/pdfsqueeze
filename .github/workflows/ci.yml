# Runs on every push and pull request: builds and tests on all three operating
# systems, plus 32-bit Windows, plus a full end-to-end run with real engines.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels the run it supersedes, so quick successive pushes do not
# stack up. (Free for a public repository; a private fork is metered: macOS
# minutes count 10x, Windows 2x.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: cargo test
      - name: Release build
        run: cargo build --release

  windows-32bit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add i686-pc-windows-msvc
      - name: Unit tests (32-bit)
        run: cargo test --target i686-pc-windows-msvc

  end-to-end-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install engines
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript qpdf tesseract-ocr tesseract-ocr-eng
      - run: cargo build --release
      - name: Smoke test every command
        run: bash ./scripts/smoke.sh target/release/pdfsqueeze

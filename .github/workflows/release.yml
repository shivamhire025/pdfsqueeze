# Builds self-contained packages and attaches them to a GitHub release when a
# version tag is pushed (or when run by hand for a dry run).
#
#   macOS    arm64 + Intel     pdfsqueeze-macos-<arch>.app.zip  (the app, double-click)
#                              pdfsqueeze-macos-<arch>.tar.gz   (command line + installer)
#   Linux    x86_64 + arm64    pdfsqueeze-linux-<arch>.tar.gz
#   Windows  x64               pdfsqueeze-windows-x64.zip
#   Windows  x86 (experimental, no OCR)
#
# STATUS: written but NEVER RUN. Expect to fix runner labels and package
# names on the first real run. Each job smoke-tests its own package with the
# system's engines out of the way before publishing it.
#
# Why older runners: bundled libraries inherit the minimum OS version of the
# machine that built them, so build on the oldest runner you want to support.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Build jobs get a read-only token: they compile third-party crates and run
# downloaded engines, so they must not be able to write to the repository.
# Only the final `publish` job (tags only) is given write access.
permissions:
  contents: read

# Only one packaging run at a time; starting another cancels the first.
# Every job below also has a timeout-minutes so a hang can never run for hours.
concurrency:
  group: release
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon, macOS 15 (macos-14 was retired by GitHub)
            arch: arm64
          - runner: macos-15-intel    # Intel (label may need updating)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build-time engines (end users never need these)
        run: brew install ghostscript qpdf tesseract
      - run: cargo test --release
      - run: bash ./scripts/package-macos.sh
      - name: Build the double-clickable app (.app, zipped)
        run: bash ./scripts/package-macos-app.sh
      - name: Smoke test the app with system engines out of reach
        run: |
          mkdir smoke-app && ditto -x -k dist/pdfsqueeze-macos-${{ matrix.arch }}.app.zip smoke-app
          codesign --verify --deep --strict smoke-app/pdfsqueeze.app
          SMOKE_REQUIRE_BUNDLED=1 env -i HOME="$HOME" PATH=/usr/bin:/bin \
            bash ./scripts/smoke.sh smoke-app/pdfsqueeze.app/Contents/MacOS/pdfsqueeze
      - name: Smoke test the package with system engines out of reach
        run: |
          mkdir smoke && tar -xzf dist/pdfsqueeze-macos-${{ matrix.arch }}.tar.gz -C smoke
          SMOKE_REQUIRE_BUNDLED=1 env -i HOME="$HOME" PATH=/usr/bin:/bin \
            bash ./scripts/smoke.sh smoke/pdfsqueeze/pdfsqueeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfsqueeze-macos-${{ matrix.arch }}
          path: |
            dist/pdfsqueeze-macos-${{ matrix.arch }}.tar.gz*
            dist/pdfsqueeze-macos-${{ matrix.arch }}.app.zip*

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04      # oldest glibc we support
            arch: x86_64
          - runner: ubuntu-22.04-arm  # arm64 runners are free for public repositories
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build-time engines (end users never need these)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-urw-base35 patchelf \
            cmake g++ zlib1g-dev libjpeg-dev libssl-dev
      # Ubuntu 22.04 ships qpdf 10.6, which lacks the JSON output pdfsqueeze needs
      # (qpdf 11+). Build a pinned current release so the package bundles a good one.
      - name: Build a current qpdf from source
        run: |
          mkdir -p /tmp/qpdf-src && cd /tmp/qpdf-src
          # Pinned release, verified by SHA-256 (bump both together, on purpose).
          gh release download v12.4.2 --repo qpdf/qpdf --pattern 'qpdf-12.4.2.tar.gz' --dir .
          echo "8a58af5b6141319287c1883bec8bd1bd545b7567b7fc5e6ce5d25a1c85f36397  qpdf-12.4.2.tar.gz" | sha256sum -c -
          tar xzf qpdf-*.tar.gz
          cd "$(find . -maxdepth 1 -type d -name 'qpdf-*' | head -1)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          sudo cmake --install build
          sudo ldconfig
          hash -r
          echo "using: $(command -v qpdf)"
          qpdf --version
      # Ubuntu 22.04 ships Ghostscript 9.55 (patched, but old). Build the pinned current release
      # from its official source tarball, verified by SHA-256.
      - name: Build Ghostscript 10.08.0 from source
        run: |
          mkdir -p /tmp/gs-src && cd /tmp/gs-src
          curl -fsSL -o gs.tar.gz https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10080/ghostscript-10.08.0.tar.gz
          echo "caf199e3f233f1290b27d0972d636f66c303355f2353309b7bfddf1edda06b3d  gs.tar.gz" | sha256sum -c -
          tar xzf gs.tar.gz && cd ghostscript-10.08.0
          ./configure --prefix=/usr/local --disable-cups --without-x
          make -j"$(nproc)"
          sudo make install
          # the colour profiles are embedded in the binary; PDF/A needs one on disk
          sudo cp -R iccprofiles /usr/local/share/ghostscript/10.08.0/
          sudo ldconfig && hash -r
          echo "using: $(command -v gs) $(gs --version)"
      - run: cargo test --release
      - run: bash ./scripts/package-linux.sh
      - name: Smoke test inside a bare container with no engines installed
        run: |
          docker run --rm -v "$PWD:/w" -e SMOKE_REQUIRE_BUNDLED=1 ubuntu:22.04 \
            bash /w/scripts/smoke.sh /w/dist/pdfsqueeze-linux-${{ matrix.arch }}/pdfsqueeze/pdfsqueeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfsqueeze-linux-${{ matrix.arch }}
          path: dist/pdfsqueeze-linux-${{ matrix.arch }}.tar.gz*

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # MSYS2 is used only for Tesseract; Ghostscript and qpdf come from their
      # official releases (MSYS2's Ghostscript has no Resource folder).
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          # English data is not installed from MSYS2: it dropped the mingw64
          # tesseract-data packages on 2026-10-17. bundle-tesseract-windows.sh
          # downloads eng.traineddata pinned by commit and sha256 instead.
          install: >-
            mingw-w64-x86_64-tesseract-ocr
      - run: cargo test --release
      - run: cargo build --release
      - name: Stage Ghostscript, qpdf and pdfsqueeze.exe
        shell: pwsh
        run: ./scripts/stage-windows.ps1 -Arch x64
      - name: Add Tesseract
        shell: msys2 {0}
        run: bash ./scripts/bundle-tesseract-windows.sh dist/pdfsqueeze-windows-x64/pdfsqueeze/engines
      - name: Smoke test with MSYS2 and Windows tools out of reach
        shell: bash
        run: |
          SMOKE_REQUIRE_BUNDLED=1 PATH="/usr/bin:/c/Windows/System32:/c/Windows" \
            bash ./scripts/smoke.sh dist/pdfsqueeze-windows-x64/pdfsqueeze/pdfsqueeze.exe
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/pdfsqueeze-windows-x64/pdfsqueeze -DestinationPath dist/pdfsqueeze-windows-x64.zip
          (Get-FileHash dist/pdfsqueeze-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  pdfsqueeze-windows-x64.zip" | Out-File -Encoding ascii dist/pdfsqueeze-windows-x64.zip.sha256
      # One-file installer (Inno Setup, pre-installed on windows-2022; pinned fallback below).
      # It installs per user, so no administrator rights are needed on the runner either.
      - name: Build the installer
        shell: pwsh
        timeout-minutes: 10
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version=6.7.0 -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $src = (Resolve-Path dist/pdfsqueeze-windows-x64/pdfsqueeze).Path
          $out = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$src" "/O$out" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $h = (Get-FileHash dist/pdfsqueeze-windows-x64-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  pdfsqueeze-windows-x64-setup.exe" | Out-File -Encoding ascii dist/pdfsqueeze-windows-x64-setup.exe.sha256
          (Get-Item dist/pdfsqueeze-windows-x64-setup.exe).Length
      # Test the installer itself before it can be published: install silently, run the same smoke
      # test against the installed copy, then uninstall. Every step has a timeout and the install
      # waits at most 4 minutes (a silent installer once hung a CI job for an hour).
      - name: Installer test, 1/3 install silently
        shell: pwsh
        timeout-minutes: 8
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "pdfsqueeze-installed"
          $log = Join-Path $env:RUNNER_TEMP "setup.log"
          $setup = (Resolve-Path "dist/pdfsqueeze-windows-x64-setup.exe").Path
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir","/LOG=$log" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "installer did not finish within 4 minutes" }
          if (Test-Path $log) { Get-Content $log -Tail 15 }
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          foreach ($f in "pdfsqueeze.exe", "unins000.exe", "engines\tesseract\tesseract.exe", "engines\share\tessdata\eng.traineddata") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing after install: $f" }
          }
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\pdfsqueeze.lnk"
          if (-not (Test-Path $lnk)) { throw "Start menu shortcut not created: $lnk" }
          "installed to $dir; Start menu shortcut present"
      - name: Installer test, 2/3 smoke test the installed copy
        shell: bash
        timeout-minutes: 15
        run: |
          INST="$(cygpath -u "$RUNNER_TEMP")/pdfsqueeze-installed"
          SMOKE_REQUIRE_BUNDLED=1 PATH="/usr/bin:/c/Windows/System32:/c/Windows" \
            bash ./scripts/smoke.sh "$INST/pdfsqueeze.exe"
      # Launch the installed app the way a person does (the Start menu shortcut, no arguments, no
      # terminal) and require the app window to appear and stay. v0.1.0 and v0.1.1 shipped without
      # this check and closed instantly on double-click.
      - name: Installer test, launch from the Start menu
        shell: pwsh
        timeout-minutes: 5
        run: |
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\pdfsqueeze.lnk"
          Start-Process -FilePath $lnk
          $app = $null
          try {
            for ($i = 0; $i -lt 60 -and -not $app; $i++) {
              Start-Sleep -Seconds 1
              $app = Get-Process pdfsqueeze -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowTitle -eq "pdfsqueeze" } | Select-Object -First 1
            }
            if (-not $app) { throw "no pdfsqueeze window within 60 seconds of launching the shortcut" }
            Start-Sleep -Seconds 15
            $app.Refresh()
            if ($app.HasExited) { throw "the app window closed by itself" }
            "window is open (process $($app.Id))"
          } finally {
            # A picture of the desktop, to check the page inside the window really rendered.
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save((Join-Path $env:RUNNER_TEMP "launch.png"))
            } catch { "screenshot failed: $_" }
            Get-Process pdfsqueeze -ErrorAction SilentlyContinue | Stop-Process -Force
          }
      # Not named pdfsqueeze-*, so the publish job never attaches it to a release.
      - name: Keep the launch screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-launch-screenshot
          path: ${{ runner.temp }}/launch.png
          if-no-files-found: ignore
      - name: Installer test, 3/3 uninstall
        shell: pwsh
        timeout-minutes: 5
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "pdfsqueeze-installed"
          $p = Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill() }
          # The uninstaller hands over to a temporary copy of itself, so wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir "pdfsqueeze.exe")); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path (Join-Path $dir "pdfsqueeze.exe")) { throw "uninstall left pdfsqueeze.exe behind" }
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\pdfsqueeze.lnk"
          if (Test-Path $lnk) { throw "uninstall left the Start menu shortcut behind" }
          "uninstalled cleanly"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfsqueeze-windows-x64
          path: |
            dist/pdfsqueeze-windows-x64.zip*
            dist/pdfsqueeze-windows-x64-setup.exe*

  # 32-bit Windows: built, tested and smoke-tested like the others, but ships
  # without OCR because Tesseract has had no 32-bit build since 5.3.1.
  windows-x86:
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup target add i686-pc-windows-msvc
      - name: Unit tests (32-bit)
        run: cargo test --release --target i686-pc-windows-msvc
      - run: cargo build --release --target i686-pc-windows-msvc
      - name: Stage Ghostscript, qpdf and pdfsqueeze.exe
        shell: pwsh
        run: ./scripts/stage-windows.ps1 -Arch x86
      - name: Smoke test (no OCR in this build)
        shell: bash
        run: |
          SMOKE_SKIP_OCR=1 SMOKE_REQUIRE_BUNDLED=1 PATH="/usr/bin:/c/Windows/System32:/c/Windows" \
            bash ./scripts/smoke.sh dist/pdfsqueeze-windows-x86/pdfsqueeze/pdfsqueeze.exe
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/pdfsqueeze-windows-x86/pdfsqueeze -DestinationPath dist/pdfsqueeze-windows-x86.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfsqueeze-windows-x86
          path: dist/pdfsqueeze-windows-x86.zip

  # The only job allowed to write: it attaches the finished, smoke-tested files to
  # the release. Runs for version tags only, and only if every package built.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows-x64, windows-x86]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pdfsqueeze-*
          merge-multiple: true
          path: dist
      - name: Create the release and attach every file
        run: |
          ls -l dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

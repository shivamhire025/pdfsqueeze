# Builds self-contained packages and attaches them to a GitHub release when a
# version tag is pushed (or when run by hand for a dry run).
#
#   macOS    arm64 + Intel     pdfsqueeze-macos-<arch>.app.zip  (the app, double-click)
#                              pdfsqueeze-macos-<arch>.tar.gz   (command line + installer)
#   Linux    x86_64 + arm64    pdfsqueeze-linux-<arch>.tar.gz
#   Windows  x64               pdfsqueeze-windows-x64.zip
#   Windows  x86 (experimental, no OCR)
#
# STATUS: written but NEVER RUN. Expect to fix runner labels and package
# names on the first real run. Each job smoke-tests its own package with the
# system's engines out of the way before publishing it.
#
# Why older runners: bundled libraries inherit the minimum OS version of the
# machine that built them, so build on the oldest runner you want to support.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Only one packaging run at a time; starting another cancels the first.
# Every job below also has a timeout-minutes so a hang can never run for hours.
concurrency:
  group: release
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple Silicon, macOS 14
            arch: arm64
          - runner: macos-15-intel    # Intel (label may need updating)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build-time engines (end users never need these)
        run: brew install ghostscript qpdf tesseract
      - run: cargo test --release
      - run: bash ./scripts/package-macos.sh
      - name: Build the double-clickable app (.app, zipped)
        run: bash ./scripts/package-macos-app.sh
      - name: Smoke test the app with system engines out of reach
        run: |
          mkdir smoke-app && ditto -x -k dist/pdfsqueeze-macos-${{ matrix.arch }}.app.zip smoke-app
          codesign --verify --deep --strict smoke-app/pdfsqueeze.app
          SMOKE_REQUIRE_BUNDLED=1 env -i HOME="$HOME" PATH=/usr/bin:/bin \
            bash ./scripts/smoke.sh smoke-app/pdfsqueeze.app/Contents/MacOS/pdfsqueeze
      - name: Smoke test the package with system engines out of reach
        run: |
          mkdir smoke && tar -xzf dist/pdfsqueeze-macos-${{ matrix.arch }}.tar.gz -C smoke
          SMOKE_REQUIRE_BUNDLED=1 env -i HOME="$HOME" PATH=/usr/bin:/bin \
            bash ./scripts/smoke.sh smoke/pdfsqueeze/pdfsqueeze
      - uses: actions/upload-artifact@v4
        with:
          name: pdfsqueeze-macos-${{ matrix.arch }}
          path: |
            dist/pdfsqueeze-macos-${{ matrix.arch }}.tar.gz*
            dist/pdfsqueeze-macos-${{ matrix.arch }}.app.zip*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/pdfsqueeze-macos-${{ matrix.arch }}.tar.gz* dist/pdfsqueeze-macos-${{ matrix.arch }}.app.zip* --clobber

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04      # oldest glibc we support
            arch: x86_64
          - runner: ubuntu-22.04-arm  # arm64 runners are free for public repositories
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build-time engines (end users never need these)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript tesseract-ocr tesseract-ocr-eng fonts-urw-base35 patchelf \
            cmake g++ zlib1g-dev libjpeg-dev libssl-dev
      # Ubuntu 22.04 ships qpdf 10.6, which lacks the JSON output pdfsqueeze needs
      # (qpdf 11+). Build the current release so the package bundles a good one.
      - name: Build a current qpdf from source
        run: |
          mkdir -p /tmp/qpdf-src && cd /tmp/qpdf-src
          gh release download --repo qpdf/qpdf --pattern 'qpdf-[0-9]*.tar.gz' --dir .
          tar xzf qpdf-*.tar.gz
          cd "$(find . -maxdepth 1 -type d -name 'qpdf-*' | head -1)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          sudo cmake --install build
          sudo ldconfig
          hash -r
          echo "using: $(command -v qpdf)"
          qpdf --version
      - run: cargo test --release
      - run: bash ./scripts/package-linux.sh
      - name: Smoke test inside a bare container with no engines installed
        run: |
          docker run --rm -v "$PWD:/w" -e SMOKE_REQUIRE_BUNDLED=1 ubuntu:22.04 \
            bash /w/scripts/smoke.sh /w/dist/pdfsqueeze-linux-${{ matrix.arch }}/pdfsqueeze/pdfsqueeze
      - uses: actions/upload-artifact@v4
        with:
          name: pdfsqueeze-linux-${{ matrix.arch }}
          path: dist/pdfsqueeze-linux-${{ matrix.arch }}.tar.gz*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/pdfsqueeze-linux-${{ matrix.arch }}.tar.gz* --clobber

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # MSYS2 is used only for Tesseract; Ghostscript and qpdf come from their
      # official releases (MSYS2's Ghostscript has no Resource folder).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-tesseract-ocr
            mingw-w64-x86_64-tesseract-data-eng
      - run: cargo test --release
      - run: cargo build --release
      - name: Stage Ghostscript, qpdf and pdfsqueeze.exe
        shell: pwsh
        run: ./scripts/stage-windows.ps1 -Arch x64
      - name: Add Tesseract
        shell: msys2 {0}
        run: bash ./scripts/bundle-tesseract-windows.sh dist/pdfsqueeze-windows-x64/pdfsqueeze/engines
      - name: Smoke test with MSYS2 and Windows tools out of reach
        shell: bash
        run: |
          SMOKE_REQUIRE_BUNDLED=1 PATH="/usr/bin:/c/Windows/System32:/c/Windows" \
            bash ./scripts/smoke.sh dist/pdfsqueeze-windows-x64/pdfsqueeze/pdfsqueeze.exe
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/pdfsqueeze-windows-x64/pdfsqueeze -DestinationPath dist/pdfsqueeze-windows-x64.zip
          (Get-FileHash dist/pdfsqueeze-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  pdfsqueeze-windows-x64.zip" | Out-File -Encoding ascii dist/pdfsqueeze-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pdfsqueeze-windows-x64
          path: dist/pdfsqueeze-windows-x64.zip*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/pdfsqueeze-windows-x64.zip* --clobber

  # 32-bit Windows: built, tested and smoke-tested like the others, but ships
  # without OCR because Tesseract has had no 32-bit build since 5.3.1.
  windows-x86:
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add i686-pc-windows-msvc
      - name: Unit tests (32-bit)
        run: cargo test --release --target i686-pc-windows-msvc
      - run: cargo build --release --target i686-pc-windows-msvc
      - name: Stage Ghostscript, qpdf and pdfsqueeze.exe
        shell: pwsh
        run: ./scripts/stage-windows.ps1 -Arch x86
      - name: Smoke test (no OCR in this build)
        shell: bash
        run: |
          SMOKE_SKIP_OCR=1 SMOKE_REQUIRE_BUNDLED=1 PATH="/usr/bin:/c/Windows/System32:/c/Windows" \
            bash ./scripts/smoke.sh dist/pdfsqueeze-windows-x86/pdfsqueeze/pdfsqueeze.exe
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/pdfsqueeze-windows-x86/pdfsqueeze -DestinationPath dist/pdfsqueeze-windows-x86.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pdfsqueeze-windows-x86
          path: dist/pdfsqueeze-windows-x86.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/pdfsqueeze-windows-x86.zip --clobber

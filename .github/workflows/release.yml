# Builds self-contained packages and attaches them to a GitHub release when a
# version tag is pushed (or when run by hand for a dry run).
#
#   macOS    arm64 + Intel     pdfsqueeze-macos-<arch>.tar.gz
#   Linux    x86_64 + arm64    pdfsqueeze-linux-<arch>.tar.gz
#   Windows  x64               pdfsqueeze-windows-x64.zip
#   Windows  x86 (experimental, no OCR)
#
# STATUS: written but NEVER RUN. Expect to fix runner labels and package
# names on the first real run. Each job smoke-tests its own package with the
# system's engines out of the way before publishing it.
#
# Why older runners: bundled libraries inherit the minimum OS version of the
# machine that built them, so build on the oldest runner you want to support.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple Silicon, macOS 14
            arch: arm64
          - runner: macos-15-intel    # Intel (label may need updating)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build-time engines (end users never need these)
        run: brew install ghostscript qpdf tesseract
      - run: cargo test --release
      - run: ./scripts/package-macos.sh
      - name: Smoke test the package with system engines out of reach
        run: |
          mkdir smoke && tar -xzf dist/pdfsqueeze-macos-${{ matrix.arch }}.tar.gz -C smoke
          SMOKE_REQUIRE_BUNDLED=1 env -i HOME="$HOME" PATH=/usr/bin:/bin \
            ./scripts/smoke.sh smoke/pdfsqueeze/pdfsqueeze
      - uses: actions/upload-artifact@v4
        with:
          name: pdfsqueeze-macos-${{ matrix.arch }}
          path: dist/pdfsqueeze-macos-${{ matrix.arch }}.tar.gz*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/pdfsqueeze-macos-${{ matrix.arch }}.tar.gz* --clobber

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04      # oldest glibc we support
            arch: x86_64
          - runner: ubuntu-24.04-arm  # arm64 runners may be unavailable for private repos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build-time engines (end users never need these)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript qpdf tesseract-ocr tesseract-ocr-eng fonts-urw-base35 patchelf
      - run: cargo test --release
      - run: ./scripts/package-linux.sh
      - name: Smoke test inside a bare container with no engines installed
        run: |
          docker run --rm -v "$PWD:/w" -e SMOKE_REQUIRE_BUNDLED=1 ubuntu:22.04 \
            /w/scripts/smoke.sh /w/dist/pdfsqueeze-linux-${{ matrix.arch }}/pdfsqueeze/pdfsqueeze
      - uses: actions/upload-artifact@v4
        with:
          name: pdfsqueeze-linux-${{ matrix.arch }}
          path: dist/pdfsqueeze-linux-${{ matrix.arch }}.tar.gz*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/pdfsqueeze-linux-${{ matrix.arch }}.tar.gz* --clobber

  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-ghostscript
            mingw-w64-x86_64-qpdf
            mingw-w64-x86_64-tesseract-ocr
            mingw-w64-x86_64-tesseract-data-eng
      - run: cargo test --release
      - run: cargo build --release
      - name: Stage package (bundle engines from MSYS2)
        shell: msys2 {0}
        env:
          PDFSQUEEZE_WIN_ARCH: x64
        run: ./scripts/package-windows.sh
      - name: Smoke test the staged package with MSYS2 and Windows tools out of reach
        shell: bash
        run: |
          SMOKE_REQUIRE_BUNDLED=1 PATH="/usr/bin:/c/Windows/System32:/c/Windows" \
            ./scripts/smoke.sh dist/pdfsqueeze-windows-x64/pdfsqueeze/pdfsqueeze.exe
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/pdfsqueeze-windows-x64/pdfsqueeze -DestinationPath dist/pdfsqueeze-windows-x64.zip
          (Get-FileHash dist/pdfsqueeze-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  pdfsqueeze-windows-x64.zip" | Out-File -Encoding ascii dist/pdfsqueeze-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pdfsqueeze-windows-x64
          path: dist/pdfsqueeze-windows-x64.zip*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/pdfsqueeze-windows-x64.zip* --clobber

  # 32-bit Windows. The program itself is built and tested for real. The engine
  # bundle is best-effort: Tesseract has no 32-bit build since 5.3.1 and Poppler
  # never did, so this package ships without OCR. Nothing is published unless
  # every step succeeds.
  windows-x86:
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add i686-pc-windows-msvc
      - name: Unit tests (32-bit)
        run: cargo test --release --target i686-pc-windows-msvc
      - run: cargo build --release --target i686-pc-windows-msvc
      - name: Fetch 32-bit Ghostscript and qpdf
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path engines32 | Out-Null
          # qpdf: a 32-bit zip from its latest release
          $q = gh api repos/qpdf/qpdf/releases/latest | ConvertFrom-Json
          $qa = $q.assets | Where-Object { $_.name -match "msvc32.*\.zip$" } | Select-Object -First 1
          if (-not $qa) { throw "no 32-bit qpdf zip in the latest qpdf release" }
          Invoke-WebRequest $qa.browser_download_url -OutFile qpdf32.zip
          Expand-Archive qpdf32.zip -DestinationPath qpdf32
          # Ghostscript: the 32-bit installer, installed silently into a folder
          $g = gh api repos/ArtifexSoftware/ghostpdl-downloads/releases/latest | ConvertFrom-Json
          $ga = $g.assets | Where-Object { $_.name -match "w32\.exe$" } | Select-Object -First 1
          if (-not $ga) { throw "no 32-bit Ghostscript installer in the latest release" }
          Invoke-WebRequest $ga.browser_download_url -OutFile gs32.exe
          Start-Process -Wait -FilePath .\gs32.exe -ArgumentList "/S", "/D=$PWD\gs32"
      - name: Stage package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "dist/pdfsqueeze-windows-x86/pdfsqueeze"
          New-Item -ItemType Directory -Force -Path "$stage/engines/bin", "$stage/engines/share/ghostscript" | Out-Null
          Copy-Item target/i686-pc-windows-msvc/release/pdfsqueeze.exe "$stage/pdfsqueeze.exe"
          $gsdir = (Get-ChildItem gs32 -Directory | Where-Object Name -like "gs*" | Select-Object -First 1).FullName
          if (-not $gsdir) { $gsdir = "gs32" }
          Copy-Item "$gsdir/bin/*" "$stage/engines/bin" -Recurse
          foreach ($d in "Resource", "lib", "iccprofiles", "fonts") {
            if (Test-Path "$gsdir/$d") { Copy-Item "$gsdir/$d" "$stage/engines/share/ghostscript/$d" -Recurse }
          }
          $qbin = (Get-ChildItem qpdf32 -Recurse -Filter qpdf.exe | Select-Object -First 1).Directory.FullName
          Copy-Item "$qbin/*" "$stage/engines/bin" -Recurse -Force
          Copy-Item LICENSE, README.md, AGENTS.md $stage
      - name: Smoke test (no OCR in this build)
        shell: bash
        run: |
          SMOKE_SKIP_OCR=1 SMOKE_REQUIRE_BUNDLED=1 PATH="/usr/bin:/c/Windows/System32:/c/Windows" \
            ./scripts/smoke.sh dist/pdfsqueeze-windows-x86/pdfsqueeze/pdfsqueeze.exe
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/pdfsqueeze-windows-x86/pdfsqueeze -DestinationPath dist/pdfsqueeze-windows-x86.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pdfsqueeze-windows-x86
          path: dist/pdfsqueeze-windows-x86.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/pdfsqueeze-windows-x86.zip --clobber

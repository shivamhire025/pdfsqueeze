[package]
name = "pdfsqueeze"
version = "0.1.0"
edition = "2021"
description = "Offline, open-source PDF toolkit: compress, merge, split and more. Nothing leaves your machine."
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
rpassword = "7"
serde_json = "1"
tiny_http = "0.12"

[profile.release]
strip = true

# A native window around the system's own web view. Mac and Windows only: on
# Linux the web view needs system GTK packages, so `ui` opens a browser there.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tao = "0.34"
wry = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21.2"
# Dock icon when started as a bare binary (a .app bundle brings its own icon).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

# Windows: put the icon inside the .exe so Explorer, the taskbar and pinned shortcuts show it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

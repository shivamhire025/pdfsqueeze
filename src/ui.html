<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdfsqueeze</title>
<style>
  /* Look: light editorial. A soft sage hero image sits behind frosted-glass panels, with a
     leaf-green accent, large light headlines and pill buttons. One look, light only. */
  :root {
    --bg: #eef4ec;
    --rail: rgba(255, 255, 255, .62);
    --surface: rgba(255, 255, 255, .80);
    --ink: #14251b;
    --muted: #3a5445;
    --faint: #4d6659;
    --line: rgba(24, 58, 36, .22);
    --accent: #86cd78;      /* leaf green: fills, buttons, selection */
    --accent-fg: #22652d;   /* the same green, deeper, for text and icons on light */
    --accent-ink: #0b2410;
    --accent-soft: rgba(134, 205, 120, .26);
    --good: #1f7a3e;
    --good-soft: rgba(31, 122, 62, .11);
    --warn: #8a5a00;
    --warn-soft: rgba(242, 195, 91, .28);
    --bad: #b3261e;
    --bad-soft: rgba(179, 38, 30, .10);
    --glass: rgba(255, 255, 255, .72);
    --shadow: 0 1px 2px rgba(20, 50, 30, .08), 0 14px 38px rgba(20, 50, 30, .12);
    --radius: 18px;
    --display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .app { display: grid; grid-template-columns: 308px minmax(0, 1fr); height: 100%; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); } .rail { max-height: 38vh; } }

  /* ---- rail ---- */
  .rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 20px 16px 16px; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
  .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .brand b { font-size: 18px; letter-spacing: -.02em; font-weight: 700; }
  .brand b span { color: var(--accent-fg); }
  .offline { margin: 0 4px; font-size: 12.5px; color: var(--good); display: flex; align-items: center; gap: 7px; font-weight: 600; }
  .offline::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .rail h2 { margin: 8px 4px 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 700; }
  .docs { list-style: none; margin: 0; padding: 0 0 2px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; overflow-x: hidden; overflow-y: auto; min-height: 0; flex: 1 1 auto; align-content: start; }
  .docs > li { min-width: 0; }
  .doc { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px; border: 1px solid var(--line); background: var(--surface);
         border-radius: 12px; cursor: pointer; text-align: left; width: 100%; }
  .doc:hover { border-color: var(--accent); }
  .doc:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .doc[aria-pressed="true"] { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--accent-soft); }
  .doc.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .thumb { width: 52px; height: 66px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; color: var(--faint); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .doc .meta { min-width: 0; }
  .doc .n { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc .s { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .x { flex: none; justify-self: end; align-self: center; padding: 0; line-height: 0; border: 0; background: transparent; color: var(--faint); width: 26px; height: 26px; border-radius: 7px; cursor: pointer; display: grid; place-items: center; }
  .x:hover { background: var(--bad-soft); color: var(--bad); }
  .x svg.i { width: 16px; height: 16px; margin: 0; }
  .x:focus-visible { outline: 2px solid var(--accent); }
  .add { border: 1.5px dashed var(--line); background: transparent; border-radius: 12px; padding: 12px; cursor: pointer; color: var(--muted); font-weight: 600;
         display: flex; align-items: center; justify-content: center; gap: 8px; }
  .add:hover, .add:focus-visible { border-color: var(--accent); color: var(--accent-fg); outline: none; }
  .norail { color: var(--muted); font-size: 13.5px; margin: 0 4px; }

  /* ---- main ---- */
  main { overflow-y: auto; min-height: 0; }
  .stage { max-width: 900px; margin: 0 auto; padding: 40px 44px 56px; }
  @media (max-width: 760px) { .stage { padding: 24px 18px 40px; } }

  .hero { display: grid; justify-items: start; gap: 6px; margin-bottom: 30px; }
  .hero.empty { justify-items: center; text-align: center; padding: 34px 0 10px; }
  .hero h1 { margin: 6px 0 0; font-size: 30px; line-height: 1.15; letter-spacing: -.025em; font-weight: 700; text-wrap: balance; }
  .hero p { margin: 0; color: var(--muted); font-size: 16px; max-width: 52ch; }
  .hero svg.art { width: 190px; height: auto; margin-bottom: 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; border-radius: 11px; font-weight: 650; cursor: pointer; border: 1px solid var(--line);
         background: var(--surface); padding: 11px 18px; }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: 13px 24px; font-size: 16px; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.primary:disabled { opacity: .6; cursor: progress; filter: none; }
  .btn.good { background: var(--good); border-color: var(--good); color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.good { color: #052116; } }
  .link { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px 0; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  .link:hover { color: var(--accent-fg); }

  .cats { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 18px; }
  .cat { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 15px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .cat:hover { color: var(--ink); border-color: var(--faint); }
  .cat[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .cat:focus-visible, .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 14px; }
  .tile { display: flex; gap: 14px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
          padding: 16px; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
  .tile:hover { transform: translateY(-2px); border-color: var(--accent); }
  .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-fg); flex: none; }
  .tile b { display: block; font-size: 16px; letter-spacing: -.01em; }
  .tile small { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.4; margin-top: 2px; }
  .foot { margin-top: 28px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--faint); font-size: 13px; }

  /* ---- task ---- */
  .task-head { display: flex; gap: 16px; align-items: center; margin: 4px 0 22px; }
  .task-head .ico { width: 52px; height: 52px; border-radius: 15px; }
  .task-head h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; line-height: 1.2; }
  .task-head p { margin: 2px 0 0; color: var(--muted); }
  .sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .field { margin: 0 0 20px; }
  .field > label, .field > .lbl { display: block; font-weight: 650; margin-bottom: 7px; }
  .field .hint { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
  .req { color: var(--bad); }
  input[type=text], input[type=number], input[type=password], select {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit;
  }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 620px) { .presets { grid-template-columns: 1fr; } }
  .preset { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 14px; cursor: pointer; }
  .preset b { display: block; }
  .preset small { color: var(--muted); display: block; margin-top: 2px; font-size: 13px; }
  .preset .bars { display: flex; gap: 3px; align-items: flex-end; height: 22px; margin-bottom: 10px; }
  .preset .bars i { width: 7px; background: var(--faint); border-radius: 2px; opacity: .55; }
  .preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
  .preset[aria-pressed="true"] .bars i { background: var(--accent); opacity: 1; }
  .preset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .check { display: flex; gap: 10px; align-items: center; cursor: pointer; font-weight: 600; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  details.more { margin: 2px 0 22px; }
  details.more summary { cursor: pointer; font-weight: 650; color: var(--muted); }
  details.more .inner { padding-top: 16px; }
  .using { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 20px; }
  .chip { display: inline-flex; gap: 8px; align-items: center; background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; font-weight: 600; }
  .runrow { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .progress { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; width: 220px; position: relative; display: block; }
  .progress::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; background: var(--accent); border-radius: 99px; animation: slide 1.1s ease-in-out infinite; }
  .progress.det::after { display: none; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease-out; }
  .progwrap { display: grid; gap: 6px; min-width: 240px; flex: 1 1 260px; max-width: 460px; }
  .progwrap .progress { width: 100%; height: 8px; }
  .proglabel { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 12px; min-height: 1.4em; }
  .proglabel b { color: var(--ink); }
  @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .progress::after { animation: none; width: 100%; } .tile { transition: none; } }

  /* ---- result ---- */
  .result { margin: 0; }
  .result.top:not(:empty) { margin: 0 0 20px; }
  .banner { border-radius: var(--radius); padding: 22px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
  .banner.good { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
  .banner.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--warn-soft); }
  .banner.bad { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); background: var(--bad-soft); }
  .banner h2 { margin: 0 0 4px; font-size: 18px; display: flex; gap: 10px; align-items: center; }
  .banner.good h2 { color: var(--good); } .banner.warn h2 { color: var(--warn); } .banner.bad h2 { color: var(--bad); }
  .banner p { margin: 0; }
  .code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; background: var(--bg); color: var(--muted); padding: 2px 7px; border-radius: 6px; }
  .big { display: grid; gap: 4px; margin: 6px 0 18px; }
  .big .pct { font-size: 46px; line-height: 1; font-weight: 750; letter-spacing: -.035em; color: var(--good); font-variant-numeric: tabular-nums; }
  .big .sizes { color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }
  .bars2 { display: grid; gap: 8px; margin: 0 0 18px; }
  .bar { display: grid; grid-template-columns: 62px 1fr 74px; gap: 12px; align-items: center; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar .track { height: 12px; background: var(--bg); border-radius: 99px; overflow: hidden; }
  .bar .track { display: block; }
  .bar .fill { display: block; height: 100%; border-radius: 99px; background: var(--faint); width: 0; transition: width .7s cubic-bezier(.2, .8, .2, 1); }
  .bar.after .fill { background: var(--good); }
  .bar b { color: var(--ink); text-align: right; }
  .rows { display: grid; gap: 10px; margin: 8px 0 16px; }
  .rowf { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); }
  .rowf .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rowf .sv { font-variant-numeric: tabular-nums; color: var(--muted); }
  .rowf .sv.good { color: var(--good); font-weight: 700; }
  .rowf .mini { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .rowf .mini { display: block; }
  .rowf .mini i { display: block; height: 100%; background: var(--good); border-radius: 99px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .saved { color: var(--good); font-weight: 650; display: inline-flex; gap: 8px; align-items: center; }
  .note { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
  dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; margin: 10px 0 0; }
  dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; word-break: break-word; }
  pre.raw { background: var(--bg); padding: 12px; border-radius: 10px; overflow: auto; font-size: 12.5px; max-height: 220px; margin: 12px 0 0; }


  /* ---- toolbar: clubbed tools ---- */
  .toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .grps { display: flex; gap: 6px; flex-wrap: wrap; background: var(--rail); border: 1px solid var(--line); border-radius: 14px; padding: 5px; min-width: 0; }
  .grp { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--muted); padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 650; }
  .grp:hover { color: var(--ink); }
  .grp[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .grp:focus-visible, .sub:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .grp.icon-only { padding: 9px; border: 1px solid var(--line); background: var(--rail); border-radius: 12px; }
  .grp.icon-only[aria-pressed="true"] { background: var(--accent); }
  .subs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 20px; }
  .sub { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); padding: 8px 13px; border-radius: 999px; cursor: pointer; font-weight: 600; }
  .sub svg.i { width: 18px; height: 18px; }
  .sub:hover { color: var(--ink); border-color: var(--faint); }
  .sub[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-fg); border-color: var(--accent); }
  @media (max-width: 760px) { .grp span { display: none; } .grp { padding: 10px 13px; } }
  .task-head { margin: 0 0 16px; }
  .task-head h1 { font-size: 22px; }

  /* ---- page grid (reorder) ---- */
  .pg-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; padding: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; position: sticky; top: 0; z-index: 5; }
  .ib { width: 40px; height: 40px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .ib:hover:not(:disabled), .ib:focus-visible { background: var(--accent-soft); color: var(--accent-fg); outline: none; }
  .ib.danger:hover:not(:disabled) { background: var(--bad-soft); color: var(--bad); }
  .ib:disabled { opacity: .35; cursor: default; }
  .ib svg.i { width: 21px; height: 21px; }
  .pg-bar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 6px 4px; }
  .pg .check { position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 7px; background: var(--surface); border: 1.5px solid var(--faint); display: grid; place-items: center; color: transparent; z-index: 2; }
  .pg .check svg.i { width: 14px; height: 14px; stroke-width: 3; }
  .pg:hover .check { border-color: var(--accent); }
  .pg.sel { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
  .pg.sel .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pg-ghost .stack { position: absolute; right: -8px; top: -8px; min-width: 26px; height: 26px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-weight: 700; display: grid; place-items: center; padding: 0 7px; }
  .pg-bar .pg-sum { margin-left: auto; padding: 0 10px; color: var(--muted); font-weight: 600; font-size: 13.5px; }
  .pagegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 14px; padding: 4px 0 6px; user-select: none; -webkit-user-select: none; }
  .pg { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 8px 8px 10px; cursor: grab; touch-action: none; display: grid; gap: 7px; position: relative; }
  .pg:hover { border-color: var(--accent); }
  .pg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pg.lifted { opacity: .3; border-style: dashed; }
  .pg .frame { aspect-ratio: 3 / 4; background: var(--surface); border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .pg img { max-width: 100%; max-height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
  .pg .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
  .pg .pos { font-weight: 700; font-size: 15px; }
  .pg .was { color: var(--faint); font-size: 12px; }
  .pg.moved { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--accent-soft); }
  .pg.moved .was { color: var(--accent-fg); font-weight: 600; }
  .pg-ghost { position: fixed; z-index: 30; pointer-events: none; margin: 0; transform: rotate(2.5deg); box-shadow: var(--shadow); cursor: grabbing; opacity: .96; }
  .pg .frame img { transition: transform .18s ease; }
  .pg .gone { display: none; position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-weight: 700; color: var(--bad); text-shadow: 0 0 6px var(--bg); pointer-events: none; }
  .pg.deleted { border-style: dashed; background: var(--bad-soft); }
  .pg.deleted .frame { opacity: .35; filter: grayscale(1); }
  .pg.deleted .gone { display: block; }
  .pg.deleted .pos { color: var(--faint); }
  .pg-loading { color: var(--muted); padding: 18px 2px; }

  .veil { position: fixed; inset: 0; background: color-mix(in srgb, var(--accent) 16%, transparent); backdrop-filter: blur(3px); display: none; place-items: center; z-index: 10; pointer-events: none; }
  .veil.on { display: grid; }
  .veil div { background: var(--surface); border: 2px dashed var(--accent); border-radius: 22px; padding: 38px 54px; font-size: 22px; font-weight: 700; box-shadow: var(--shadow); }
  .hidden { display: none !important; }

  .ucards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .ucard { border: 1px solid var(--line); background: rgba(255, 255, 255, .46); border-radius: 16px; padding: 10px; display: grid; gap: 4px; min-width: 0; }
  .uframe { position: relative; aspect-ratio: 3 / 4; border-radius: 9px; background: rgba(24, 58, 36, .07); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; color: var(--faint); }
  .uframe img { width: 100%; height: 100%; object-fit: contain; object-position: top; display: block; }
  .unum { position: absolute; top: 7px; left: 7px; min-width: 26px; height: 26px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-weight: 700; display: grid; place-items: center; padding: 0 7px; font-variant-numeric: tabular-nums; }
  .uname { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
  .umeta { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .cx { position: absolute; top: 7px; right: 7px; width: 26px; height: 26px; padding: 0; line-height: 0; border-radius: 50%; border: 1px solid var(--line);
        background: rgba(255, 255, 255, .82); color: var(--ink); cursor: pointer; display: grid; place-items: center; z-index: 2; }
  .cx svg.i { width: 14px; height: 14px; }
  .cx:hover, .cx:focus-visible { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); outline: none; }
  .ugrip { justify-self: center; margin-top: 6px; width: 38px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); background: rgba(255, 255, 255, .5); cursor: grab; }
  .ugrip svg.i { width: 18px; height: 18px; }
  .ucards.sortable .ucard[data-uid] { cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
  .ucards.sortable .ucard[data-uid]:hover { border-color: var(--accent); }
  .ucards.sortable .ucard[data-uid]:hover .ugrip, .ugrip:focus-visible { color: var(--accent-fg); border-color: var(--accent); outline: none; }
  .ucard.lifted { opacity: .3; border-style: dashed; }
  .ucard-ghost { position: fixed; z-index: 30; pointer-events: none; margin: 0; transform: rotate(2deg); box-shadow: var(--shadow); opacity: .96; cursor: grabbing; background: var(--surface); }
  body.grabbing, body.grabbing * { cursor: grabbing !important; }
  .ib.sm { width: 32px; height: 32px; border-color: var(--line); }
  .ib.sm svg.i { width: 17px; height: 17px; }
  svg.i.flip { transform: scaleX(-1); }
  .ucard { grid-template-columns: minmax(0, 1fr); }
  .ucard.add { display: grid; justify-items: stretch; align-content: start; width: 100%; cursor: pointer; background: transparent; border: 1px dashed var(--line); color: var(--muted); text-align: left; font: inherit; }
  .ucard.add .uframe { width: 100%; background: rgba(255, 255, 255, .38); border: 1px dashed var(--line); }
  .ucard.add .uframe svg.i { width: 38px; height: 38px; stroke-width: 1.4; }
  .ucard.add .uname { color: var(--ink); }
  .ucard.add:hover, .ucard.add:focus-visible { border-color: var(--accent); color: var(--accent-fg); outline: none; background: var(--accent-soft); }

  /* ---- cinematic layer: hero image, frame, glass, type ---- */
  html { background: var(--bg); }
  body { background: transparent; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; background:
      linear-gradient(90deg, rgba(246, 250, 244, .94) 0%, rgba(240, 247, 240, .86) 40%, rgba(236, 245, 238, .76) 100%),
      var(--hero, none) center / cover no-repeat; }
  .app { margin: 14px; height: calc(100% - 28px); border: 1px solid rgba(60, 130, 70, .38); border-radius: 28px; overflow: hidden; background: rgba(255, 255, 255, .20); }
  .rail { background: var(--rail); -webkit-backdrop-filter: blur(22px) saturate(1.15); backdrop-filter: blur(22px) saturate(1.15); border-right: 1px solid var(--line); }
  .sheet, .banner, .tile, .doc, .pg-bar { -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  .sheet { background: var(--glass); border-radius: 22px; }
  .doc { background: rgba(255, 255, 255, .46); border-radius: 16px; }
  .doc[aria-pressed="true"] { background: var(--accent-soft); }
  .thumb { background: rgba(24, 58, 36, .07); border-color: var(--line); }
  input[type=text], input[type=number], input[type=password], select { background: rgba(24, 58, 36, .06); border-radius: 12px; }
  .pg { background: rgba(255, 255, 255, .46); }
  .pg .frame { background: rgba(24, 58, 36, .07); }
  .pg-bar { background: var(--glass); border-radius: 16px; }
  .preset { background: rgba(24, 58, 36, .05); }
  .grps { background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-radius: 999px; padding: 5px; }
  .grp { border-radius: 999px; }
  .grp.icon-only { background: var(--glass); border-radius: 999px; }
  .sub { background: rgba(255, 255, 255, .5); }
  .hero h1, .task-head h1 { font-family: var(--display); font-weight: 300; letter-spacing: -.035em; }
  .task-head h1 { font-size: 34px; line-height: 1.1; }
  .task-head p { font-size: 15.5px; }
  .brand b { font-family: var(--display); font-weight: 400; letter-spacing: -.02em; }
  .btn { border-radius: 999px; background: rgba(255, 255, 255, .55); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: 13px 28px; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.good { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .mark { background: var(--accent); color: var(--accent-ink); border-radius: 50%; }
  .progress i, .progress::after { background: var(--accent); }
  .bar .fill, .bar.after .fill { background: var(--accent); }
  .bar.after .fill { background: var(--good); }

  /* first screen: big headline, pill actions, numbered chapters */
  .cine { min-height: calc(100vh - 150px); display: flex; flex-direction: column; justify-content: flex-end; gap: 22px; padding-bottom: 6px; }
  .cine h1 { margin: 0; font-family: var(--display); font-weight: 300; font-size: clamp(44px, 6.4vw, 92px); line-height: 1.0; letter-spacing: -.045em; color: #12241a; text-wrap: balance; }
  .cine p { margin: 0; max-width: 46ch; color: var(--muted); font-size: 17px; }
  .cta { display: flex; gap: 10px; align-items: center; }
  .pill { border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 650; font-size: 15.5px; padding: 15px 26px; cursor: pointer; }
  .pill.round { width: 52px; height: 52px; padding: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .72); color: var(--ink); border: 1px solid var(--line); }
  .pill:hover { filter: brightness(1.07); }
  .pill:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .chapters { list-style: none; margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
  .chapters li { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; position: relative; }
  .chapters li:first-child::before { content: ""; position: absolute; top: -1px; left: 0; width: 46%; height: 2px; background: var(--accent); }
  .chapters b { font-size: 12.5px; color: var(--muted); font-weight: 600; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .chapters span { font-size: 15px; }
  @media (max-width: 760px) { .app { margin: 8px; height: calc(100% - 16px); border-radius: 20px; } .chapters { grid-template-columns: 1fr; gap: 12px; } }

  /* ---- minimal layer: flatter and quieter, closer to a desktop app than a dashboard ---- */
  :root { --radius: 12px; }
  .app { margin: 0; height: 100%; border: 0; border-radius: 0; background: transparent; grid-template-columns: 252px minmax(0, 1fr); }
  .rail, .sheet, .banner, .tile, .doc, .pg-bar, .grps, .grp.icon-only, .pg, .ucard { -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; }
  .rail { padding: 18px 10px 12px; gap: 10px; background: rgba(255, 255, 255, .74); }
  .brand { padding: 0 8px; }
  .offline { margin: 0 8px; font-weight: 500; }
  .rail h2 { margin: 6px 8px 0; }
  .docs { gap: 2px; }
  .doc { grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; padding: 6px 8px; border: 0; border-radius: 8px; background: transparent; }
  .doc:hover { background: rgba(24, 58, 36, .06); }
  .doc[aria-pressed="true"] { background: rgba(24, 58, 36, .06); }
  .doc.active { background: var(--accent-soft); box-shadow: none; }
  .thumb { width: 34px; height: 44px; border-radius: 4px; }
  .doc .n { font-size: 13.5px; font-weight: 600; }
  .doc .s { font-size: 12px; }
  .add { border-radius: 8px; padding: 9px; font-weight: 500; }
  .stage { max-width: 1120px; padding: 14px 28px 40px; }
  .toolbar { border-bottom: 1px solid var(--line); margin: 0 0 8px; gap: 6px; }
  .grps { background: transparent; border: 0; border-radius: 0; padding: 0; gap: 2px; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .grp { border-radius: 0; padding: 12px 12px; font-weight: 600; font-size: 14px; color: var(--muted); background: transparent; box-shadow: inset 0 -2px 0 transparent; }
  .grp svg.i { width: 19px; height: 19px; }
  .grp:hover { color: var(--ink); }
  .grp[aria-pressed="true"] { background: transparent; color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent-fg); }
  .grp.icon-only { padding: 10px; border: 0; background: transparent; border-radius: 8px; margin-bottom: 2px; }
  .grp.icon-only[aria-pressed="true"] { background: var(--accent-soft); box-shadow: none; }
  .subs { gap: 2px; margin: 0 0 14px; }
  .sub { border: 0; background: transparent; border-radius: 8px; padding: 6px 10px; font-weight: 500; font-size: 14px; }
  .sub svg.i { width: 17px; height: 17px; }
  .sub:hover { background: rgba(24, 58, 36, .06); }
  .sub[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border: 0; font-weight: 600; }
  .sheet { background: rgba(255, 255, 255, .80); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .field { margin: 0 0 16px; }
  .pg-bar { border-radius: 10px; padding: 3px; gap: 2px; margin: 0 0 12px; background: rgba(255, 255, 255, .9); }
  .pg-bar .pg-sum { font-weight: 500; font-size: 13px; }
  .ib { border-radius: 8px; width: 36px; height: 36px; }
  .ib svg.i { width: 19px; height: 19px; }
  .pagegrid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; }
  .pg { border-radius: 8px; padding: 6px 6px 8px; background: rgba(255, 255, 255, .6); }
  .pg .pos { font-size: 13px; }
  .ucard { border-radius: 10px; background: rgba(255, 255, 255, .6); }
  .btn, .pill { border-radius: 10px; }
  .btn.primary { padding: 10px 22px; font-size: 15px; font-weight: 650; }
  .runrow { margin-top: 4px; }
  .banner { border-radius: 12px; padding: 16px 18px; }
  .preset, .tile { border-radius: 10px; }
  input[type=text], input[type=number], input[type=password], select { border-radius: 8px; }
  .grp span { white-space: nowrap; }
  /* one white card holds the toolbar, the tool links and the work, so nothing sits on the photo */
  .board { background: rgba(255, 255, 255, .94); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .board .toolbar { margin: 0; padding: 0 14px; border-bottom: 1px solid var(--line); }
  .board .subs { margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); background: rgba(24, 58, 36, .03); }
  .board-body { padding: 16px 16px 18px; }
  .board .sheet { background: transparent; border: 0; padding: 0; border-radius: 0; }
  .board .pg-bar { background: rgba(24, 58, 36, .045); border: 0; }
  .board .pg, .board .ucard { background: #fff; }
  .board .banner { background: rgba(255, 255, 255, .9); }
  /* legibility: a frosted backing keeps the photograph soft behind working screens, text colours are
     darker (secondary text 5:1 or better) and disabled states are still readable */
  main { background: rgba(255, 255, 255, .50); -webkit-backdrop-filter: blur(12px) saturate(1.08); backdrop-filter: blur(12px) saturate(1.08); }
  main:has(.cine) { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .rail { background: rgba(255, 255, 255, .80); }
  .pg, .ucard { background: rgba(255, 255, 255, .86); }
  .pg-bar { background: rgba(255, 255, 255, .96); border: 1px solid var(--line); }
  .sheet { background: rgba(255, 255, 255, .88); }
  .ib:disabled { opacity: .45; }
  .grp[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--accent-fg); }
  .sub[aria-pressed="true"] { background: rgba(134, 205, 120, .42); }
  .doc.active { background: rgba(134, 205, 120, .38); box-shadow: none; border-color: transparent; }
  .pg.sel { background: rgba(134, 205, 120, .42); box-shadow: inset 0 0 0 2px var(--accent-fg); border-color: var(--accent-fg); }
  .pg .check { border-color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent-fg); outline-offset: 2px; }
  /* screens made only of cards (pages, documents) sit directly on the background; forms keep a panel */
  .sheet:has(.pg-bar), .sheet:has(.ucards):not(:has(input)):not(:has(select)):not(:has(.presets)) { background: transparent; border: 0; padding: 0; }
  .sheet:has(.pg-bar) .runrow, .sheet:has(.ucards):not(:has(input)):not(:has(.presets)) .runrow { margin-top: 14px; }

  /* ---- many results: preview strip ---- */
  .strip { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .strip img { height: 76px; width: auto; max-width: 110px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  .strip .more { font-weight: 600; color: var(--muted); padding: 0 6px; }

  /* ---- sign ---- */
  .signer { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 22px; align-items: start; }
  @media (max-width: 900px) { .signer { grid-template-columns: 1fr; } }
  .sg-label { font-weight: 650; margin: 0 0 8px; }
  .sgmodes { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(24, 58, 36, .06); margin: 0 0 10px; }
  .sgmode { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .sgmode svg.i { width: 17px; height: 17px; }
  .sgmode[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(20, 50, 30, .15); }
  .sgpad { position: relative; border: 1px dashed var(--faint); border-radius: 12px; background: #fff; min-height: 150px; display: grid; }
  .sgpad canvas { width: 100%; height: auto; aspect-ratio: 3 / 1; display: none; touch-action: none; cursor: crosshair; border-radius: 12px; }
  .sgpad.draw canvas { display: block; }
  .sgpad #sg-text { display: none; border: 0; background: transparent; font: 40px/1.3 "Snell Roundhand", "Segoe Script", "Brush Script MT", "Lucida Handwriting", "Apple Chancery", cursive; padding: 28px 20px; text-align: center; }
  .sgpad.type #sg-text { display: block; }
  .sgpad #sg-text:focus-visible { outline: none; }
  .sg-imgbox { display: none; padding: 22px; gap: 12px; justify-items: start; align-content: center; }
  .sgpad.image .sg-imgbox { display: grid; }
  .sg-empty { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; color: var(--faint); font-size: 13px; pointer-events: none; letter-spacing: .04em; }
  .sgpad:not(.draw) .sg-empty { display: none; }
  .sg-tools { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .sg-inks { display: inline-flex; gap: 8px; }
  .ink { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .ink[aria-pressed="true"] { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--accent-fg); }
  .sg-pager { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; flex-wrap: wrap; }
  .sg-pager #sg-pageno { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 96px; text-align: center; }
  .sg-every { margin-left: auto; font-weight: 500; }
  .sg-stage { position: relative; border: 1px solid var(--line); background: #fff; border-radius: 6px; overflow: hidden; line-height: 0; user-select: none; -webkit-user-select: none; }
  .sg-stage #sg-page { width: 100%; height: auto; display: block; }
  .sg-stage #sg-sig { position: absolute; cursor: move; touch-action: none; outline: 1.5px dashed var(--accent-fg); outline-offset: 2px; }
  .sg-handle { position: absolute; width: 18px; height: 18px; border-radius: 4px; background: var(--accent-fg); border: 2px solid #fff; cursor: nwse-resize; touch-action: none; }

  /* ---- opening splash: the photograph at full strength with a white logo ---- */
  #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background:
      radial-gradient(ellipse 34% 30% at 50% 50%, rgba(4, 12, 10, .62) 0%, rgba(4, 12, 10, .38) 55%, rgba(4, 12, 10, 0) 100%),
      radial-gradient(ellipse at center, rgba(4, 12, 10, .06) 0%, rgba(4, 12, 10, .50) 100%),
      var(--hero, #0c1a17) center / cover no-repeat, #0c1a17; transition: opacity .6s ease, visibility .6s; cursor: pointer; }
  #splash.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  .splash-logo { display: grid; justify-items: center; gap: 14px; color: #fff; text-align: center; animation: splashIn .9s ease both; }
  .splash-logo svg { width: 92px; height: 92px; filter: drop-shadow(0 4px 18px rgba(0, 0, 0, .35)); }
  .splash-word { font-family: var(--display); font-weight: 300; font-size: 40px; letter-spacing: -.02em; text-shadow: 0 2px 18px rgba(0, 0, 0, .4); }
  .splash-tag { font-size: 14.5px; letter-spacing: .04em; opacity: .92; font-weight: 500; text-shadow: 0 1px 10px rgba(0, 0, 0, .4); }
  @keyframes splashIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .splash-logo { animation: none; } #splash { transition: none; } }
</style>
</head>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const GRID_TOOL = "organize";
(function splash() {
  const el = document.getElementById("splash");
  if (!el) return;
  let done = false;
  const hide = () => { if (done) return; done = true; el.classList.add("gone"); setTimeout(() => el.remove(), 700); };
  const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!/[?&]splash=hold\b/.test(location.search)) setTimeout(hide, calm ? 600 : 1700);
  el.addEventListener("pointerdown", hide);
  window.addEventListener("keydown", hide, { once: true });
})();
document.documentElement.style.setProperty("--hero", `url("/hero.jpg?t=${encodeURIComponent(TOKEN)}")`);

const CATS = [
  { id: "shrink", icon: "compress", label: "Shrink and fix", tools: ["compress", "repair", "check", "linearize", "pdfa"] },
  { id: "pages", icon: "organize", label: "Pages", tools: ["organize", "merge", "split", "extract"] },
  { id: "convert", icon: "to_images", label: "Convert", tools: ["to_images", "images_to_pdf", "text", "ocr"] },
  { id: "secure", icon: "protect", label: "Protect and clean", tools: ["protect", "unlock", "strip_metadata", "info"] },
  { id: "stamp", icon: "watermark", label: "Sign", tools: ["sign", "watermark", "number_pages"] },
];
const TITLE = {
  compress: "Compress", repair: "Repair", check: "Check for problems", linearize: "Fast web view", pdfa: "Archive as PDF/A",
  merge: "Merge", split: "Split", extract: "Extract pages", organize: "Organize pages", delete: "Delete pages", reorder: "Reorder pages", rotate: "Rotate pages",
  to_images: "PDF to images", images_to_pdf: "Images to PDF", text: "Extract text", ocr: "Make searchable",
  protect: "Add a password", unlock: "Remove a password", strip_metadata: "Remove metadata", info: "Inspect",
  sign: "Sign", watermark: "Add a watermark", number_pages: "Number the pages", doctor: "Check setup",
};
const BLURB = {
  compress: "Make a file smaller, or fit a size limit.", repair: "Rebuild a damaged PDF.", check: "Look for structural problems.",
  linearize: "Let it start showing before it finishes downloading.", pdfa: "Convert for long-term storage.",
  merge: "Join several PDFs into one.", split: "Break a PDF into parts.", extract: "Keep only the pages you pick.", delete: "Remove pages you do not need.",
  organize: "Reorder, rotate and delete pages.", sign: "Place your signature on a page.", reorder: "Put pages in a new order.", rotate: "Turn pages clockwise.",
  to_images: "Save every page as a picture.", images_to_pdf: "Combine pictures into one PDF.", text: "Pull the words out of a PDF.",
  ocr: "Turn scans into text you can search and copy.",
  protect: "Lock it with strong encryption.", unlock: "Take a password off.", strip_metadata: "Remove author, title and edit history.",
  info: "Pages, encryption and document details.", watermark: "Stamp text across every page.", number_pages: "Add page numbers.",
  doctor: "See which engines are installed.",
};
// Fields the server decides itself (results folder, uploaded paths, password files).
const HIDDEN = new Set(["output", "out_dir", "tessdata", "password_file", "recursive"]);
const FILE_ARGS = new Set(["input", "inputs"]);
const PRIMARY = { compress: ["target_size"], ocr: ["lang"] };
const LABEL = { target_size: "Or fit under a size", lang: "Language", dpi: "Image resolution (dpi)", quality: "JPEG quality (1 to 100)",
  pages: "Which pages", order: "New order", angle: "Turn by (degrees)", every: "A new file every N pages", ranges: "Ranges", text: "Text",
  opacity: "Opacity (0 to 1)", size: "Font size", position: "Position", format: "Label", start: "First page number", part: "PDF/A part",
  first: "First page", last: "Last page", layout: "Keep the column layout", all: "Recognise every page, even ones with text", jobs: "Pages at once", angle_: "" };
const PLACEHOLDER = { target_size: "for example 2MB or 500KB", pages: "for example 1-3,7,z (z is the last page)", order: "for example 3,1,2",
  ranges: "for example 1-3,4-9", text: "for example CONFIDENTIAL", lang: "eng", format: "for example Page {n} of {total}" };

let tools = [], files = [], selected = new Set(), cat = "shrink", current = null, preset = "recommended";
let result = null, running = false, saved = {};
let mergeOrder = []; // ids in the order documents will be joined (merge) or processed
function orderedChosen() {
  const have = new Set(files.filter((f) => selected.has(f.id)).map((f) => f.id));
  const out = mergeOrder.filter((id) => have.has(id));
  for (const f of files) if (have.has(f.id) && !out.includes(f.id)) out.push(f.id);
  mergeOrder = out;
  return out.map((id) => files.find((f) => f.id === id));
}
let active = null; // the document single-file tools work on: the one picked last in the list
function activeId() {
  const has = (id) => files.some((f) => f.id === id);
  if (active && has(active) && (selected.has(active) || selected.size === 0)) return active;
  const firstSel = files.find((f) => selected.has(f.id));
  return (firstSel || files[0] || {}).id || null;
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ico = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const human = (n) => { if (n < 1024) return n + " B"; const u = ["KB", "MB", "GB"]; let i = -1; do { n /= 1024; i++; } while (n >= 1024 && i < 2); return (n < 10 ? n.toFixed(1) : Math.round(n)) + " " + u[i]; };
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Token": TOKEN, ...(opts.headers || {}) } });
  return r.json();
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

// A preview that cannot load becomes a plain document icon.
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img && img.tagName === "IMG" && img.closest(".thumb")) img.outerHTML = ico("doc");
}, true);

/* ---------- documents rail ---------- */
function renderDocs() {
  const ul = $("docs"); ul.innerHTML = "";
  for (const f of files) {
    const li = document.createElement("li");
    const on = selected.has(f.id);
    const thumb = (f.kind === "pdf" || f.kind === "image")
      ? `<img alt="" loading="lazy" src="/api/thumb?id=${encodeURIComponent(f.id)}&t=${encodeURIComponent(TOKEN)}">`
      : ico("doc");
    const detail = [f.pages ? plural(f.pages, "page") : null, human(f.size)].filter(Boolean).join(" · ");
    li.innerHTML = `<div class="doc${on && f.id === activeId() ? " active" : ""}" role="button" tabindex="0" aria-pressed="${on}" data-id="${esc(f.id)}" title="${esc(f.name)}">
        <div class="thumb">${thumb}</div>
        <div class="meta"><div class="n">${esc(f.name)}</div><div class="s">${esc(detail)}</div></div>
        <button class="x" type="button" aria-label="Remove ${esc(f.name)}" data-remove="${esc(f.id)}">${ico("close")}</button>
      </div>`;
    ul.appendChild(li);
  }
  $("norail").classList.toggle("hidden", files.length > 0);
}
async function removeDoc(id) {
  if (running) return;
  await post("/api/remove", { id });
  files = files.filter((f) => f.id !== id); selected.delete(id);
  mergeOrder = mergeOrder.filter((x) => x !== id);
  if (active === id) active = null;
  if (pg.id === id) pg = newPg(null);
  renderDocs(); render();
}
$("docs").addEventListener("click", async (e) => {
  const rm = e.target.closest("[data-remove]");
  if (rm) {
    e.stopPropagation();
    await removeDoc(rm.dataset.remove);
    return;
  }
  const d = e.target.closest(".doc");
  if (d) { toggle(d.dataset.id); }
});
$("docs").addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("doc")) { e.preventDefault(); toggle(e.target.dataset.id); }
});
// A click makes a document the one the tools work on; clicking the document that is already
// the working one takes it out of the selection (merge uses every selected document).
function toggle(id) {
  if (selected.has(id) && activeId() === id) selected.delete(id);
  else { selected.add(id); active = id; }
  renderDocs(); if (current) render();
}

async function refreshFiles() {
  const f = await api("/api/files");
  if (!f.ok) return;
  const known = new Set(files.map((x) => x.id));
  for (const x of f.files) if (!known.has(x.id)) selected.add(x.id);
  files = f.files.filter((x) => !x.name.startsWith(SIG_NAME));
  renderDocs(); render();
}
async function upload(list) {
  for (const file of list) {
    try {
      const j = await api("/api/upload?name=" + encodeURIComponent(file.name), { method: "POST", body: file });
      if (j.ok) { files.push(j.file); selected.add(j.file.id); active = j.file.id; renderDocs(); render(); }
      else showFatal(j.error);
    } catch (e) { showFatal({ code: "error", message: String(e) }); }
  }
}
const picker = $("picker");
$("add").addEventListener("click", () => picker.click());
picker.addEventListener("change", () => { upload([...picker.files]); picker.value = ""; });
// Browser-style drops (only used when running in a browser; the app window delivers real paths).
const veil = $("veil");
window.addEventListener("dragover", (e) => { e.preventDefault(); veil.classList.add("on"); });
window.addEventListener("dragleave", (e) => { if (!e.relatedTarget) veil.classList.remove("on"); });
window.addEventListener("drop", (e) => { e.preventDefault(); veil.classList.remove("on"); if (e.dataTransfer && e.dataTransfer.files.length) upload([...e.dataTransfer.files]); });
// Hooks the native window calls.
window.native = { filesChanged: refreshFiles, dragging: (on) => veil.classList.toggle("on", !!on) };

/* ---------- views ---------- */
function render() {
  const v = $("view");
  if (!files.length && !(current && current.name === "doctor")) { renderEmpty(v); return; }
  if (!current) current = tools.find((t) => t.name === "organize") || tools[0] || null;
  if (!current) { v.innerHTML = ""; return; }
  renderTask(v);
}

function sheetArt() {
  return `<svg class="art" viewBox="0 0 200 150" aria-hidden="true">
    <rect x="46" y="22" width="92" height="116" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="2" transform="rotate(-9 92 80)"/>
    <rect x="58" y="14" width="92" height="116" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="2" transform="rotate(4 104 72)"/>
    <rect x="56" y="18" width="92" height="116" rx="9" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
    <path d="M118 18h21a9 9 0 0 1 9 9v21z" fill="var(--accent-soft)"/>
    <rect x="70" y="52" width="48" height="6" rx="3" fill="var(--line)"/><rect x="70" y="68" width="62" height="6" rx="3" fill="var(--line)"/>
    <rect x="70" y="84" width="38" height="6" rx="3" fill="var(--line)"/>
    <circle cx="150" cy="116" r="19" fill="var(--accent)"/><path d="M150 107v18M141 116h18" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

function renderEmpty(v) {
  v.innerHTML = `<section class="cine">
      <h1>Your PDFs,<br>on your machine.</h1>
      <p>Organize pages, compress, convert and make scans searchable. Nothing is ever uploaded.</p>
      <div class="cta">
        <button class="pill" id="choose" type="button">Choose files</button>
        <button class="pill round" type="button" data-choose aria-label="Choose files">${ico("arrow")}</button>
      </div>
      <ol class="chapters">
        <li><b>01</b><span>Drop in a PDF</span></li>
        <li><b>02</b><span>Pick what to do</span></li>
        <li><b>03</b><span>Save the result</span></li>
      </ol>
    </section>`;
}

// Tools are clubbed into a few icon groups; picking a group shows its tools beside each other.
function toolbarHtml() {
  const have = new Set(tools.map((t) => t.name));
  const group = CATS.find((c) => c.tools.includes(current.name)) || null;
  if (group) cat = group.id;
  const groups = CATS.map((c) => `<button class="grp" type="button" data-cat="${c.id}" aria-pressed="${!!group && c.id === group.id}" title="${esc(c.label)}">
      ${ico(c.icon)}<span>${esc(c.label)}</span></button>`).join("");
  const subs = group ? group.tools.filter((n) => have.has(n)).map((n) => `<button class="sub" type="button" data-tool="${n}" aria-pressed="${n === current.name}" title="${esc(BLURB[n] || "")}">
      ${ico(n)}<span>${esc(TITLE[n] || n)}</span></button>`).join("") : "";
  return `<div class="toolbar"><nav class="grps" aria-label="Tool groups">${groups}</nav>
      <button class="grp icon-only" type="button" data-tool="doctor" aria-pressed="${current.name === "doctor"}" title="Check setup" aria-label="Check setup">${ico("doctor")}</button></div>
    ${subs ? `<nav class="subs" aria-label="${esc(group.label)} tools">${subs}</nav>` : ""}`;
}

function fileArgKey() { return Object.keys(current.input_schema.properties || {}).find((k) => FILE_ARGS.has(k)); }

function renderTask(v) {
  const props = current.input_schema.properties || {};
  const required = new Set(current.input_schema.required || []);
  const fk = fileArgKey();
  const multi = fk && props[fk].type === "array";
  const chosen = files.filter((f) => selected.has(f.id));
  let html = `<div class="board">${toolbarHtml()}
    <div class="board-body"><div class="result top" id="result" aria-live="polite"></div>
    <div class="sheet"><form id="form" autocomplete="off" onsubmit="return false">`;

  if (fk) {
    if (!files.length) {
      html += `<div class="field"><div class="lbl">Files</div><div class="hint">Add a file first, using Add files on the left.</div></div>`;
    } else if (multi) {
      const list = orderedChosen();
      const isMerge = current.name === "merge";
      const pages = list.reduce((n, f) => n + (f.pages || 0), 0);
      const cards = list.map((f, i) => `<div class="ucard" data-uid="${esc(f.id)}">
          <div class="uframe">${f.kind === "pdf" || f.kind === "image"
            ? `<img alt="" src="/api/thumb?id=${encodeURIComponent(f.id)}&t=${encodeURIComponent(TOKEN)}">` : ico("doc")}
            ${isMerge ? `<span class="unum">${i + 1}</span>` : ""}
            <button class="cx" type="button" data-remove="${esc(f.id)}" title="Remove from here" aria-label="Remove ${esc(f.name)}">${ico("close")}</button></div>
          <div class="uname" title="${esc(f.name)}">${esc(f.name)}</div>
          <div class="umeta">${esc([f.pages ? plural(f.pages, "page") : null, human(f.size)].filter(Boolean).join(" · "))}</div>
          ${isMerge && list.length > 1 ? `<div class="ugrip" tabindex="0" role="button" title="Drag to change the order" aria-label="Move ${esc(f.name)}: drag, or use the left and right arrow keys"><svg class="i"><use href="#i-move"/></svg></div>` : ""}
        </div>`).join("");
      // Same size as a document card, in the glass style: opens the file picker.
      const addCard = `<button class="ucard add" type="button" data-choose aria-label="Add another PDF">
          <div class="uframe"><svg class="i"><use href="#i-plus"/></svg></div>
          <div class="uname">Add a PDF</div><div class="umeta">${isMerge ? "Joined at the end" : "From this computer"}</div>
          ${isMerge && list.length > 1 ? '<div class="ugrip" aria-hidden="true" style="visibility:hidden"><svg class="i"><use href="#i-move"/></svg></div>' : ""}
        </button>`;
      html += `<div class="field"><span class="lbl">${isMerge ? "Joined in this order" : "Using"}</span>
        <div class="ucards${isMerge && list.length > 1 ? " sortable" : ""}">${cards}${addCard}</div>
        ${isMerge && list.length > 1 ? `<div class="hint">Result: ${plural(pages, "page")} from ${list.length} documents. Use the cross on a card to remove it.</div>` : ""}</div>`;
    } else {
      // One document: the list on the left already marks the one in use.
    }
  }

  if (current.name === "compress") {
    const P = [["low", "Light", "Best quality, smaller savings", [14, 17, 20, 22]], ["recommended", "Balanced", "Good for email and sharing", [10, 14, 17, 19]], ["extreme", "Smallest", "Screen quality, biggest savings", [5, 8, 11, 14]]];
    html += `<div class="field"><span class="lbl">How small?</span><div class="presets" id="presets">${P.map(([v2, t, d, b]) =>
      `<button type="button" class="preset" data-preset="${v2}" aria-pressed="${preset === v2}"><span class="bars">${b.map((h) => `<i style="height:${h}px"></i>`).join("")}</span><b>${t}</b><small>${d}</small></button>`).join("")}</div></div>`;
  }

  const skip = (k) => HIDDEN.has(k) || FILE_ARGS.has(k) || k === "level" || k === "password_file" || (current.name === GRID_TOOL && (k === "order" || k === "rotate")) || (current.name === "sign" && ["image", "page", "x", "y", "width"].includes(k));
  const keys = Object.keys(props).filter((k) => !skip(k));
  const primary = PRIMARY[current.name] || [];
  const main = keys.filter((k) => required.has(k) || primary.includes(k));
  const extra = keys.filter((k) => !main.includes(k));
  if ("password_file" in props) {
    html += `<div class="field"><label for="f_password">Password</label><input id="f_password" type="password" autocomplete="new-password">
      <div class="hint">${current.name === "unlock" ? "Leave blank if the file only has editing restrictions." : "Keep it somewhere safe: it cannot be recovered."}</div></div>`;
  }
  if (current.name === GRID_TOOL) {
    html += `<div class="field">
      <div class="pg-bar" id="pgbar" hidden role="toolbar" aria-label="Page actions" title="Click pages to select them (Shift-click for a range), then use the icons. Drag a page, or a selection, to move it.">
        <button class="ib" type="button" data-pgact="selall" title="Select all pages" aria-label="Select all pages"><svg class="i"><use href="#i-selall"/></svg></button>
        <button class="ib" type="button" data-pgact="selnone" title="Clear selection" aria-label="Clear selection"><svg class="i"><use href="#i-selnone"/></svg></button>
        <span class="sep" aria-hidden="true"></span>
        <button class="ib" type="button" data-pgact="left" title="Turn selected pages left" aria-label="Turn selected pages left"><svg class="i"><use href="#i-rotl"/></svg></button>
        <button class="ib" type="button" data-pgact="right" title="Turn selected pages right" aria-label="Turn selected pages right"><svg class="i"><use href="#i-rotate"/></svg></button>
        <button class="ib danger" type="button" data-pgact="del" id="pg-del" title="Remove selected pages" aria-label="Remove selected pages"><svg class="i"><use href="#i-delete"/></svg></button>
        <span class="sep" aria-hidden="true"></span>
        <button class="ib" type="button" data-pgact="reverse" title="Reverse the page order" aria-label="Reverse the page order"><svg class="i"><use href="#i-reorder"/></svg></button>
        <button class="ib" type="button" data-pgact="reset" title="Undo all changes" aria-label="Undo all changes"><svg class="i"><use href="#i-undo"/></svg></button>
        <span class="pg-sum" id="pgsum" aria-live="polite"></span></div>
      <div id="pagearea"><div class="pg-loading">Loading page previews…</div></div></div>`;
  }
  if (current.name === "sign") html += signPanelHtml();
  html += main.map((k) => fieldHtml(k, props[k], required.has(k))).join("");
  if (extra.length) html += `<details class="more"><summary>More options</summary><div class="inner">${extra.map((k) => fieldHtml(k, props[k], false)).join("")}</div></details>`;

  html += `<div class="runrow"><button class="btn primary" id="run" type="button" ${running ? "disabled" : ""}>${running ? "Working…" : esc(TITLE[current.name] || "Run")}</button>
      ${running ? '<div class="progwrap"><span class="progress" id="pbar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100"><i></i></span><div class="proglabel"><span id="plabel">Starting…</span><b id="ppct"></b></div></div>' : ""}</div></form></div></div></div>`;

  sg.place.x = Math.max(0, Math.min(100 - sg.place.w, sg.place.x));
  sg.place.y = Math.max(0, Math.min(100 - hPct, sg.place.y));
  sig.style.left = sg.place.x + "%"; sig.style.top = sg.place.y + "%"; sig.style.width = sg.place.w + "%";
  handle.style.left = `calc(${sg.place.x + sg.place.w}% - 9px)`; handle.style.top = `calc(${sg.place.y + hPct}% - 9px)`;
}
function sgTyped() {
  const text = (document.getElementById("sg-text").value || "").trim();
  sg.text = text;
  if (!text) { sgCommit(null); return; }
  const c = document.createElement("canvas"), ctx = c.getContext("2d");
  const font = '120px "Snell Roundhand", "Segoe Script", "Brush Script MT", "Lucida Handwriting", "Apple Chancery", cursive';
  ctx.font = font; const wide = Math.ceil(ctx.measureText(text).width) + 80;
  c.width = Math.min(2400, wide); c.height = 260;
  const x = c.getContext("2d"); x.font = font; x.fillStyle = sg.ink; x.textBaseline = "middle"; x.fillText(text, 40, 140);
  sgCommit(c);
}
function sgFromImage() {
  if (!sg.imgSrc) { sgCommit(null); return; }
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1000 / img.width), c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const x = c.getContext("2d"); x.drawImage(img, 0, 0, c.width, c.height);
    if (sg.removeBg) {
      const id = x.getImageData(0, 0, c.width, c.height), d = id.data;
      for (let i = 0; i < d.length; i += 4) {
        const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const a = Math.max(0, Math.min(255, (242 - lum) * 7));
        d[i + 3] = Math.min(d[i + 3], a);
      }
      x.putImageData(id, 0, 0);
    }
    sgCommit(c);
  };
  img.src = sg.imgSrc;
}
function sgRefresh() { if (sg.mode === "draw") { const raw = sg.raw; if (!raw) return sgCommit(null); const i = new Image(); i.onload = () => { const c = document.createElement("canvas"); c.width = 900; c.height = 300; c.getContext("2d").drawImage(i, 0, 0); sgCommit(c); }; i.src = raw; } else if (sg.mode === "type") sgTyped(); else sgFromImage(); }
function initSign() {
  const cv = sgCanvas(); if (!cv) return;
  if (sg.raw) { const i = new Image(); i.onload = () => cv.getContext("2d").drawImage(i, 0, 0); i.src = sg.raw; }
  const page = document.getElementById("sg-page");
  const settle = () => { sgPlace(); };
  if (page) { if (page.complete) settle(); else page.addEventListener("load", settle, { once: true }); }
  sgRefresh();
}
async function sgEnsureUploaded() {
  if (sg.serverId && sg.uploadedFor === sg.dataUrl) return sg.serverId;
  const blob = await (await fetch(sg.dataUrl)).blob();
  if (sg.serverId) { try { await post("/api/remove", { id: sg.serverId }); } catch (e) {} sg.serverId = null; }
  const j = await api("/api/upload?name=" + encodeURIComponent(SIG_NAME + ".png"), { method: "POST", body: blob });
  if (!j.ok) throw new Error((j.error && j.error.message) || "upload failed");
  sg.serverId = j.file.id; sg.uploadedFor = sg.dataUrl;
  return sg.serverId;
}
(function wireSign() {
  const view = $("view");
  let drawing = false, last = null, move = null;
  const pos = (e, cv) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  view.addEventListener("pointerdown", (e) => {
    const cv = e.target.closest("#sg-canvas");
    if (cv && sg.mode === "draw") { drawing = true; last = pos(e, cv); const x = cv.getContext("2d"); x.fillStyle = sg.ink; x.beginPath(); x.arc(last[0], last[1], 3.2, 0, 7); x.fill(); e.preventDefault(); return; }
    const sig = e.target.closest("#sg-sig"), handle = e.target.closest("#sg-handle");
    if (sig || handle) {
      const st = document.getElementById("sg-stage").getBoundingClientRect();
      move = { kind: handle ? "size" : "move", sx: e.clientX, sy: e.clientY, p: { ...sg.place }, st }; e.preventDefault();
    }
  });
  window.addEventListener("pointermove", (e) => {
    if (drawing) {
      const cv = sgCanvas(); if (!cv) return;
      const p = pos(e, cv), x = cv.getContext("2d");
      x.strokeStyle = sg.ink; x.lineWidth = 6.4; x.lineCap = "round"; x.lineJoin = "round";
      x.beginPath(); x.moveTo(last[0], last[1]); x.lineTo(p[0], p[1]); x.stroke(); last = p; return;
    }
    if (move) {
      const dx = (e.clientX - move.sx) / move.st.width * 100, dy = (e.clientY - move.sy) / move.st.height * 100;
      if (move.kind === "move") { sg.place.x = move.p.x + dx; sg.place.y = move.p.y + dy; }
      else { sg.place.w = move.p.w + dx; }
      sgPlace();
    }
  });
  const up = () => {
    if (drawing) { drawing = false; const cv = sgCanvas(); if (cv) { sg.raw = cv.toDataURL("image/png"); sgCommit(cv); } }
    move = null;
  };
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
  view.addEventListener("click", (e) => {
    const m = e.target.closest("[data-sg-mode]");
    if (m) { sg.mode = m.dataset.sgMode; render(); return; }
    const ink = e.target.closest("[data-ink]");
    if (ink) { sg.ink = ink.dataset.ink; if (sg.mode === "type") sgTyped(); render(); return; }
    if (e.target.closest("#sg-clear")) { sg.raw = null; sg.text = ""; sg.imgSrc = null; sgCommit(null); render(); return; }
    if (e.target.closest("#sg-pick")) { document.getElementById("sg-file").click(); return; }
    if (e.target.closest("#sg-prev-page") && sg.page > 1) { sg.page--; render(); return; }
    if (e.target.closest("#sg-next-page") && sg.page < sg.count) { sg.page++; render(); return; }
  });
  view.addEventListener("input", (e) => {
    if (e.target.id === "sg-text") sgTyped();
  });
  view.addEventListener("change", (e) => {
    if (e.target.id === "sg-every") { sg.every = e.target.checked; return; }
    if (e.target.id === "sg-bg") { sg.removeBg = e.target.checked; sgFromImage(); return; }
    if (e.target.id === "sg-file" && e.target.files[0]) {
      const r = new FileReader();
      r.onload = () => { sg.imgSrc = String(r.result); sgFromImage(); };
      r.readAsDataURL(e.target.files[0]);
    }
  });
  window.addEventListener("resize", sgPlace);
})();

/* ---------- run ---------- */
async function run() {
  if (!current || running) return;
  const props = current.input_schema.properties || {};
  const fk = fileArgKey(), multi = fk && props[fk].type === "array";
  const args = {};
  for (const el of document.querySelectorAll("#form [data-key]")) {
    const key = el.dataset.key;
    if (el.dataset.type === "boolean") { if (el.checked) args[key] = true; continue; }
    const val = el.value.trim();
    if (val === "") continue;
    args[key] = (el.dataset.type === "integer" || el.dataset.type === "number") ? Number(val) : val;
  }
  if (current.name === "compress" && !args.target_size) args.level = preset;
  if (current.name === GRID_TOOL && pg.status === "ready") {
    const keep = pg.order.filter((n) => !pg.del.has(n));
    if (!keep.length) { result = { env: { ok: false, error: { code: "usage", message: "Every page is removed. Restore at least one page." } } }; renderResult(); return; }
    args.order = keep.join(",");
    const rot = keep.filter((n) => (pg.rot.get(n) || 0) % 360).map((n) => `${n}:${pg.rot.get(n) % 360}`);
    if (rot.length) args.rotate = rot.join(",");
  }
  let signId = null;
  if (current.name === "sign") {
    if (!sg.has) { result = { env: { ok: false, error: { code: "usage", message: "Create your signature first: draw it, type it or choose an image." } } }; renderResult(); return; }
    try { signId = await sgEnsureUploaded(); } catch (e) { result = { env: { ok: false, error: { code: "error", message: "Could not prepare the signature: " + String(e) } } }; renderResult(); return; }
    args.page = sg.every ? `1-${sg.count}` : String(sg.page);
    args.x = +sg.place.x.toFixed(2); args.y = +sg.place.y.toFixed(2); args.width = +sg.place.w.toFixed(2);
  }
  const fileMap = {};
  if (signId) fileMap.image = [signId];
  if (fk) {
    let ids;
    if (multi) ids = orderedChosen().map((f) => f.id);
    else { const id = activeId(); ids = id ? [id] : []; }
    if (!ids.length) { result = { env: { ok: false, error: { code: "usage", message: "Add a document first, then try again." } } }; renderResult(); return; }
    fileMap[fk] = ids;
  }
  running = true; result = null; saved = {}; render();
  const poll = setInterval(pollProgress, 250);
  try {
    const pw = document.getElementById("f_password");
    const j = await post("/api/run", { tool: current.name, args, files: fileMap, password: pw ? pw.value : "" });
    result = j.envelope ? { env: j.envelope, downloads: j.downloads || [], used: fileMap[fk] || [] } : { env: { ok: false, error: j.error } };
  } catch (e) { result = { env: { ok: false, error: { code: "error", message: String(e) } } }; }
  clearInterval(poll);
  running = false; render();
}
async function pollProgress() {
  let p;
  try { p = await api("/api/progress"); } catch (e) { return; }
  const bar = document.getElementById("pbar");
  if (!bar || !p.ok) return;
  const lbl = document.getElementById("plabel"), pct = document.getElementById("ppct"), fill = bar.firstElementChild;
  lbl.textContent = p.label || "Working…";
  if (typeof p.fraction === "number") {
    const v = Math.max(0, Math.min(100, Math.round(p.fraction * 100)));
    bar.classList.add("det"); fill.style.width = v + "%";
    bar.setAttribute("aria-valuenow", String(v)); pct.textContent = v + "%";
  } else {
    bar.classList.remove("det"); fill.style.width = "0"; bar.removeAttribute("aria-valuenow"); pct.textContent = "";
  }
}

/* ---------- results ---------- */
const SUMMARY = {
  sign: (r) => `Signed ${plural(r.signed_pages.length, "page")}.`,
  ocr: (r) => r.ocr_pages === 0 ? `Nothing to do: all ${r.total_pages} pages already contain text.`
    : `Recognised ${r.ocr_pages} of ${r.total_pages} pages${r.already_text_pages ? ` (${r.already_text_pages} already had text)` : ""}. ${r.characters.toLocaleString()} characters are now searchable.`,
  merge: (r) => `Joined ${r.inputs} files into one PDF.`, split: (r) => `Split into ${r.count} files.`,
  extract: (r) => `Kept ${plural(r.pages_kept, "page")}.`, delete: (r) => `${plural(r.pages_remaining, "page")} remain.`,
  organize: (r) => `Done: ${plural(r.pages_kept, "page")} kept` + (r.pages_removed ? `, ${r.pages_removed} removed` : "") + (r.pages_rotated ? `, ${r.pages_rotated} turned` : "") + ".",
  reorder: () => "Pages reordered.", rotate: (r) => `Rotated ${r.angle} degrees clockwise.`,
  to_images: (r) => `Saved ${plural(r.count, "image")}.`, images_to_pdf: (r) => `Created a PDF with ${plural(r.pages, "page")}.`,
  text: (r) => `Extracted ${r.characters.toLocaleString()} characters of text.`,
  protect: () => "Locked with AES-256 encryption. Keep the password safe: it cannot be recovered.", unlock: () => "Password removed.",
  strip_metadata: (r) => `Document info removed: ${r.removed_info ? "yes" : "none found"}. Hidden XMP metadata removed: ${r.removed_xmp ? "yes" : "none found"}.`,
  watermark: (r) => `Watermarked ${plural(r.pages, "page")}.`, number_pages: (r) => `Numbered ${plural(r.pages, "page")}.`,
  linearize: () => "Optimised for fast web viewing.",
  pdfa: (r) => `Converted to PDF/A-${r.part}. ${r.declares_pdfa ? "It declares PDF/A" : "It does not declare PDF/A"}; this is best effort and not certified.`,
  repair: (r) => r.clean ? `Repaired using ${r.method}.` : `Partly recovered using ${r.method}.${r.data_lost ? " Some content could not be recovered: the file looks incomplete." : ""}`,
  check: (r) => ({ ok: "No problems found.", problems: "Readable, but has problems. Try Repair.", damaged: "Damaged. Try Repair." }[r.status] || ""),
};
function kv(obj) {
  const rows = Object.entries(obj).filter(([, v]) => v !== null && v !== "" && !(Array.isArray(v) && !v.length))
    .map(([k, v]) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${typeof v === "object" ? esc(JSON.stringify(v)) : esc(v)}</dd>`).join("");
  return rows ? `<dl class="kv">${rows}</dl>` : "";
}
function saveRow(d) {
  const s = saved[d.rel];
  if (s) return `<span class="saved">${ico("ok")} Saved to Downloads</span>
      <button class="btn" type="button" data-reveal="${esc(s.path)}">${ico("folder")} Show in folder</button>
      <button class="btn" type="button" data-open="${esc(s.path)}">Open</button>`;
  return `<button class="btn good" type="button" data-save="${esc(d.rel)}">Save ${esc(d.name)} <span style="opacity:.85">${human(d.size)}</span></button>`;
}
// Many results (pages as images, split parts): previews, then one button for all of them.
function saveAllBlock(dls, command) {
  const total = dls.reduce((n, d) => n + (d.size || 0), 0);
  const isImg = (d) => /\.(png|jpe?g|webp)$/i.test(d.name);
  const shown = dls.filter(isImg).slice(0, 12);
  const strip = shown.length
    ? `<div class="strip">${shown.map((d) => `<img alt="${esc(d.name)}" title="${esc(d.name)}" src="/api/download?rel=${encodeURIComponent(d.rel)}&t=${encodeURIComponent(TOKEN)}">`).join("")}${
        dls.length > shown.length ? `<span class="more">+${dls.length - shown.length}</span>` : ""}</div>` : "";
  const done = saved.__all;
  const label = isImg(dls[0]) ? plural(dls.length, "image") : plural(dls.length, "file");
  if (done) {
    return `${strip}<div class="actions" style="margin-top:14px"><span class="saved">${ico("ok")} Saved ${esc(label)} to Downloads</span>
      <button class="btn" type="button" data-open="${esc(done.folder)}">${ico("folder")} Open folder</button></div>
      <div class="hint" style="margin-top:8px">${esc(done.folder)}</div>`;
  }
  return `${strip}<div class="actions" style="margin-top:14px"><button class="btn good" type="button" data-save-all>Save all ${esc(label)} <span style="opacity:.85">${human(total)}</span></button></div>`;
}
function folderNameFor(dls, command) {
  const base = dls[0].name.replace(/\.[^.]+$/, "").replace(/-part-\d+$/, "").replace(/-\d+$/, "").replace(/^__+/, "") || "results";
  const suffix = /^to[-_]images$/.test(command) ? "images" : command === "split" ? "parts" : "results";
  return `${base}-${suffix}`;
}
async function saveAll() {
  const dls = (result && result.downloads) || [];
  if (dls.length < 2) return;
  const j = await post("/api/save_all", { rels: dls.map((d) => d.rel), folder: folderNameFor(dls, result.env.command) });
  if (j.ok) { saved.__all = { folder: j.folder, count: j.count }; renderResult(); }
  else { result = { env: { ok: false, error: j.error } }; renderResult(); }
}
function renderResult() {
  const box = document.getElementById("result");
  if (!box || !result) return;
  const env = result.env, dls = result.downloads || [];
  if (!env.ok && env.error) {
    box.innerHTML = `<div class="banner bad" role="alert"><h2>${ico("warn")} That did not work</h2><p>${esc(env.error.message || "Something went wrong.")}</p>
      <p style="margin-top:10px"><span class="code">${esc(env.error.code || "error")}</span></p></div>`;
    return;
  }
  const r = env.result || {}, partial = env.exit_code === 3;
  let body = "";
  if (env.command === "compress" && r.files) {
    const ok = r.files.filter((f) => f.status === "ok" && !f.kept_original);
    const sum = r.summary;
    if (r.files.length === 1 && r.files[0].status === "ok") {
      const f = r.files[0], pct = Math.max(0, f.saved_percent);
      body += f.kept_original
        ? `<div class="big"><span class="pct" style="color:var(--ink)">Already optimal</span><span class="sizes">${human(f.before_bytes)}: compressing would not make it smaller, so it was left as is.</span></div>`
        : `<div class="big"><span class="pct">${pct}% smaller</span><span class="sizes">${human(f.before_bytes)} to ${human(f.after_bytes)}</span></div>
           <div class="bars2"><div class="bar"><span>Before</span><span class="track"><span class="fill" data-w="100"></span></span><b>${human(f.before_bytes)}</b></div>
           <div class="bar after"><span>After</span><span class="track"><span class="fill" data-w="${Math.max(2, 100 - pct)}"></span></span><b>${human(f.after_bytes)}</b></div></div>`;
    } else {
      body += `<div class="big"><span class="pct">${sum.saved_percent}% smaller</span><span class="sizes">${human(sum.before_bytes)} to ${human(sum.after_bytes)} across ${plural(sum.processed, "file")}</span></div>
        <div class="rows">` + r.files.map((f) => f.status === "ok"
          ? `<div class="rowf"><span class="nm">${esc(f.input.split(/[\\/]/).pop())}</span><span class="sv ${f.saved_percent > 0 ? "good" : ""}">${f.kept_original ? "already optimal" : human(f.before_bytes) + " to " + human(f.after_bytes)}</span>
             <span class="mini"><i style="width:${f.kept_original ? 100 : Math.max(2, 100 - f.saved_percent)}%"></i></span></div>`
          : `<div class="rowf"><span class="nm">${esc(f.input.split(/[\\/]/).pop())}</span><span class="sv" style="color:var(--bad)">${esc(f.error && f.error.message || "failed")}</span></div>`).join("") + `</div>`;
    }
  } else if (env.command === "doctor" && r.engines) {
    body += `<div class="rows">` + r.engines.map((e) => `<div class="rowf"><span class="nm">${esc(e.name)}</span><span class="sv ${e.found ? "good" : ""}">${e.found ? (e.bundled ? "built in" : "found") : "missing"}</span></div>`).join("") + `</div>`;
  } else if (env.command === "info") {
    const { info, ...rest } = r;
    body += kv({ pages: rest.pages, encrypted: rest.encrypted ? "yes" : "no", size: human(rest.size_bytes || 0), xmp_present: rest.xmp_present });
    if (info && Object.keys(info).length) body += `<h3 style="margin:18px 0 0;font-size:15px">Document details</h3>` + kv(info);
  } else if (env.command === "check" || env.command === "repair") {
    body += `<p style="margin:2px 0 0">${esc(SUMMARY[env.command](r))}</p>`;
    const msgs = r.messages || r.notes || [];
    if (msgs.length) body += `<pre class="raw">${esc(msgs.slice(0, 12).join("\n"))}</pre>`;
  } else if (SUMMARY[env.command]) {
    body += `<p style="margin:2px 0 0">${esc(SUMMARY[env.command](r))}</p>`;
  }
  const warns = (env.warnings || []).map((w) => `<div class="note">${esc(w)}</div>`).join("");
  const klass = partial ? "warn" : "good";
  const title = partial ? "Finished, with problems" : "Done";
  const actions = dls.length > 1 ? saveAllBlock(dls, env.command)
    : dls.length ? `<div class="actions" style="margin-top:16px">${dls.map(saveRow).join("")}</div>` : "";
  box.innerHTML = `<div class="banner ${klass}"><h2>${ico(partial ? "warn" : "ok")} ${title}</h2>${body}${actions}${warns}</div>`;
  // animate the bars from zero on the next frame
  requestAnimationFrame(() => requestAnimationFrame(() => box.querySelectorAll(".fill[data-w]").forEach((el) => { el.style.width = el.dataset.w + "%"; })));
}
async function saveFile(rel) {
  const j = await post("/api/save", { rel });
  if (j.ok) { saved[rel] = { path: j.path, folder: j.folder }; renderResult(); }
  else { result = { env: { ok: false, error: j.error } }; renderResult(); }
}
function showFatal(err) { result = { env: { ok: false, error: err } }; if (!current) { current = tools.find((t) => t.name === "doctor") || null; } render(); }

/* ---------- start ---------- */
(async function init() {
  try {
    const j = await api("/api/tools");
    if (!j.ok) throw new Error((j.error && j.error.message) || "could not load tools");
    tools = j.result.tools;
    await refreshFiles();
    render();
  } catch (e) {
    $("view").innerHTML = `<div class="banner bad"><h2>Could not start</h2><p>${esc(e.message || e)}</p></div>`;
  }
})();
</script>
</body>
</html>

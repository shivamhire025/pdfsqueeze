<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdfsqueeze</title>
<style>
  /* Layout concept: a document rail on the left (real page thumbnails you pick from),
     a task area on the right. One thing on screen at a time: choose, set, result. */
  :root {
    --bg: #eef1f6;        /* cool paper */
    --rail: #f7f8fb;
    --surface: #ffffff;
    --ink: #0f1828;
    --muted: #5b677a;
    --faint: #8793a6;
    --line: #dce1ea;
    --accent: #2750e0;    /* cobalt */
    --accent-ink: #ffffff;
    --accent-soft: #e7edff;
    --good: #117a55;
    --good-soft: #e1f5ec;
    --warn: #8f5500;
    --warn-soft: #fff1d1;
    --bad: #bf2f25;
    --bad-soft: #fde9e6;
    --shadow: 0 1px 2px rgba(15, 24, 40, .05), 0 10px 28px rgba(15, 24, 40, .07);
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0e16; --rail: #0f141e; --surface: #151b27; --ink: #e8edf6; --muted: #98a5ba; --faint: #6f7c91;
      --line: #232c3c; --accent: #7f9cff; --accent-ink: #0a1024; --accent-soft: #1a2547;
      --good: #4ed79f; --good-soft: #0f2a20; --warn: #f2c35b; --warn-soft: #2e2410; --bad: #ff8d83; --bad-soft: #321614;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0e16; --rail: #0f141e; --surface: #151b27; --ink: #e8edf6; --muted: #98a5ba; --faint: #6f7c91;
    --line: #232c3c; --accent: #7f9cff; --accent-ink: #0a1024; --accent-soft: #1a2547;
    --good: #4ed79f; --good-soft: #0f2a20; --warn: #f2c35b; --warn-soft: #2e2410; --bad: #ff8d83; --bad-soft: #321614;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .app { display: grid; grid-template-columns: 308px minmax(0, 1fr); height: 100%; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); } .rail { max-height: 38vh; } }

  /* ---- rail ---- */
  .rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 20px 16px 16px; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
  .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .brand b { font-size: 18px; letter-spacing: -.02em; font-weight: 700; }
  .brand b span { color: var(--accent); }
  .offline { margin: 0 4px; font-size: 12.5px; color: var(--good); display: flex; align-items: center; gap: 7px; font-weight: 600; }
  .offline::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .rail h2 { margin: 8px 4px 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 700; }
  .docs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; overflow-y: auto; min-height: 0; flex: 1 1 auto; align-content: start; padding-bottom: 2px; }
  .doc { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px; border: 1px solid var(--line); background: var(--surface);
         border-radius: 12px; cursor: pointer; text-align: left; width: 100%; }
  .doc:hover { border-color: var(--accent); }
  .doc:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .doc[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
  .thumb { width: 52px; height: 66px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; color: var(--faint); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .doc .meta { min-width: 0; }
  .doc .n { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc .s { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .x { border: 0; background: transparent; color: var(--faint); width: 26px; height: 26px; border-radius: 7px; cursor: pointer; display: grid; place-items: center; }
  .x:hover { background: var(--bad-soft); color: var(--bad); }
  .x:focus-visible { outline: 2px solid var(--accent); }
  .add { border: 1.5px dashed var(--line); background: transparent; border-radius: 12px; padding: 12px; cursor: pointer; color: var(--muted); font-weight: 600;
         display: flex; align-items: center; justify-content: center; gap: 8px; }
  .add:hover, .add:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
  .norail { color: var(--muted); font-size: 13.5px; margin: 0 4px; }

  /* ---- main ---- */
  main { overflow-y: auto; min-height: 0; }
  .stage { max-width: 900px; margin: 0 auto; padding: 40px 44px 56px; }
  @media (max-width: 760px) { .stage { padding: 24px 18px 40px; } }

  .hero { display: grid; justify-items: start; gap: 6px; margin-bottom: 30px; }
  .hero.empty { justify-items: center; text-align: center; padding: 34px 0 10px; }
  .hero h1 { margin: 6px 0 0; font-size: 30px; line-height: 1.15; letter-spacing: -.025em; font-weight: 700; text-wrap: balance; }
  .hero p { margin: 0; color: var(--muted); font-size: 16px; max-width: 52ch; }
  .hero svg.art { width: 190px; height: auto; margin-bottom: 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; border-radius: 11px; font-weight: 650; cursor: pointer; border: 1px solid var(--line);
         background: var(--surface); padding: 11px 18px; }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: 13px 24px; font-size: 16px; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.primary:disabled { opacity: .6; cursor: progress; filter: none; }
  .btn.good { background: var(--good); border-color: var(--good); color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.good { color: #052116; } }
  .link { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px 0; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  .link:hover { color: var(--accent); }

  .cats { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 18px; }
  .cat { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 15px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .cat:hover { color: var(--ink); border-color: var(--faint); }
  .cat[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .cat:focus-visible, .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 14px; }
  .tile { display: flex; gap: 14px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
          padding: 16px; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
  .tile:hover { transform: translateY(-2px); border-color: var(--accent); }
  .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
  .tile b { display: block; font-size: 16px; letter-spacing: -.01em; }
  .tile small { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.4; margin-top: 2px; }
  .foot { margin-top: 28px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--faint); font-size: 13px; }

  /* ---- task ---- */
  .task-head { display: flex; gap: 16px; align-items: center; margin: 4px 0 22px; }
  .task-head .ico { width: 52px; height: 52px; border-radius: 15px; }
  .task-head h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; line-height: 1.2; }
  .task-head p { margin: 2px 0 0; color: var(--muted); }
  .sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .field { margin: 0 0 20px; }
  .field > label, .field > .lbl { display: block; font-weight: 650; margin-bottom: 7px; }
  .field .hint { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
  .req { color: var(--bad); }
  input[type=text], input[type=number], input[type=password], select {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit;
  }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 620px) { .presets { grid-template-columns: 1fr; } }
  .preset { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 14px; cursor: pointer; }
  .preset b { display: block; }
  .preset small { color: var(--muted); display: block; margin-top: 2px; font-size: 13px; }
  .preset .bars { display: flex; gap: 3px; align-items: flex-end; height: 22px; margin-bottom: 10px; }
  .preset .bars i { width: 7px; background: var(--faint); border-radius: 2px; opacity: .55; }
  .preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
  .preset[aria-pressed="true"] .bars i { background: var(--accent); opacity: 1; }
  .preset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .check { display: flex; gap: 10px; align-items: center; cursor: pointer; font-weight: 600; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  details.more { margin: 2px 0 22px; }
  details.more summary { cursor: pointer; font-weight: 650; color: var(--muted); }
  details.more .inner { padding-top: 16px; }
  .using { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 20px; }
  .chip { display: inline-flex; gap: 8px; align-items: center; background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; font-weight: 600; }
  .runrow { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .progress { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; width: 220px; position: relative; display: block; }
  .progress::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; background: var(--accent); border-radius: 99px; animation: slide 1.1s ease-in-out infinite; }
  .progress.det::after { display: none; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease-out; }
  .progwrap { display: grid; gap: 6px; min-width: 240px; flex: 1 1 260px; max-width: 460px; }
  .progwrap .progress { width: 100%; height: 8px; }
  .proglabel { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 12px; min-height: 1.4em; }
  .proglabel b { color: var(--ink); }
  @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .progress::after { animation: none; width: 100%; } .tile { transition: none; } }

  /* ---- result ---- */
  .result { margin: 0; }
  .result.top:not(:empty) { margin: 0 0 20px; }
  .banner { border-radius: var(--radius); padding: 22px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
  .banner.good { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
  .banner.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--warn-soft); }
  .banner.bad { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); background: var(--bad-soft); }
  .banner h2 { margin: 0 0 4px; font-size: 18px; display: flex; gap: 10px; align-items: center; }
  .banner.good h2 { color: var(--good); } .banner.warn h2 { color: var(--warn); } .banner.bad h2 { color: var(--bad); }
  .banner p { margin: 0; }
  .code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; background: var(--bg); color: var(--muted); padding: 2px 7px; border-radius: 6px; }
  .big { display: grid; gap: 4px; margin: 6px 0 18px; }
  .big .pct { font-size: 46px; line-height: 1; font-weight: 750; letter-spacing: -.035em; color: var(--good); font-variant-numeric: tabular-nums; }
  .big .sizes { color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }
  .bars2 { display: grid; gap: 8px; margin: 0 0 18px; }
  .bar { display: grid; grid-template-columns: 62px 1fr 74px; gap: 12px; align-items: center; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar .track { height: 12px; background: var(--bg); border-radius: 99px; overflow: hidden; }
  .bar .track { display: block; }
  .bar .fill { display: block; height: 100%; border-radius: 99px; background: var(--faint); width: 0; transition: width .7s cubic-bezier(.2, .8, .2, 1); }
  .bar.after .fill { background: var(--good); }
  .bar b { color: var(--ink); text-align: right; }
  .rows { display: grid; gap: 10px; margin: 8px 0 16px; }
  .rowf { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); }
  .rowf .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rowf .sv { font-variant-numeric: tabular-nums; color: var(--muted); }
  .rowf .sv.good { color: var(--good); font-weight: 700; }
  .rowf .mini { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .rowf .mini { display: block; }
  .rowf .mini i { display: block; height: 100%; background: var(--good); border-radius: 99px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .saved { color: var(--good); font-weight: 650; display: inline-flex; gap: 8px; align-items: center; }
  .note { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
  dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; margin: 10px 0 0; }
  dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; word-break: break-word; }
  pre.raw { background: var(--bg); padding: 12px; border-radius: 10px; overflow: auto; font-size: 12.5px; max-height: 220px; margin: 12px 0 0; }


  /* ---- toolbar: clubbed tools ---- */
  .toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .grps { display: flex; gap: 6px; flex-wrap: wrap; background: var(--rail); border: 1px solid var(--line); border-radius: 14px; padding: 5px; min-width: 0; }
  .grp { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--muted); padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 650; }
  .grp:hover { color: var(--ink); }
  .grp[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .grp:focus-visible, .sub:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .grp.icon-only { padding: 9px; border: 1px solid var(--line); background: var(--rail); border-radius: 12px; }
  .grp.icon-only[aria-pressed="true"] { background: var(--accent); }
  .subs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 20px; }
  .sub { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); padding: 8px 13px; border-radius: 999px; cursor: pointer; font-weight: 600; }
  .sub svg.i { width: 18px; height: 18px; }
  .sub:hover { color: var(--ink); border-color: var(--faint); }
  .sub[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  @media (max-width: 760px) { .grp span { display: none; } .grp { padding: 10px 13px; } }
  .task-head { margin: 0 0 16px; }
  .task-head h1 { font-size: 22px; }

  /* ---- page grid (reorder) ---- */
  .pg-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; padding: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; position: sticky; top: 0; z-index: 5; }
  .ib { width: 40px; height: 40px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .ib:hover:not(:disabled), .ib:focus-visible { background: var(--accent-soft); color: var(--accent); outline: none; }
  .ib.danger:hover:not(:disabled) { background: var(--bad-soft); color: var(--bad); }
  .ib:disabled { opacity: .35; cursor: default; }
  .ib svg.i { width: 21px; height: 21px; }
  .pg-bar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 6px 4px; }
  .pg .check { position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 7px; background: var(--surface); border: 1.5px solid var(--faint); display: grid; place-items: center; color: transparent; z-index: 2; }
  .pg .check svg.i { width: 14px; height: 14px; stroke-width: 3; }
  .pg:hover .check { border-color: var(--accent); }
  .pg.sel { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
  .pg.sel .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pg-ghost .stack { position: absolute; right: -8px; top: -8px; min-width: 26px; height: 26px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-weight: 700; display: grid; place-items: center; padding: 0 7px; }
  .pg-bar .pg-sum { margin-left: auto; padding: 0 10px; color: var(--muted); font-weight: 600; font-size: 13.5px; }
  .pagegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 14px; padding: 4px 0 6px; user-select: none; -webkit-user-select: none; }
  .pg { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 8px 8px 10px; cursor: grab; touch-action: none; display: grid; gap: 7px; position: relative; }
  .pg:hover { border-color: var(--accent); }
  .pg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pg.lifted { opacity: .3; border-style: dashed; }
  .pg .frame { aspect-ratio: 3 / 4; background: var(--surface); border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
  .pg img { max-width: 100%; max-height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
  .pg .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
  .pg .pos { font-weight: 700; font-size: 15px; }
  .pg .was { color: var(--faint); font-size: 12px; }
  .pg.moved { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--accent-soft); }
  .pg.moved .was { color: var(--accent); font-weight: 600; }
  .pg-ghost { position: fixed; z-index: 30; pointer-events: none; margin: 0; transform: rotate(2.5deg); box-shadow: var(--shadow); cursor: grabbing; opacity: .96; }
  .pg .frame img { transition: transform .18s ease; }
  .pg .gone { display: none; position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-weight: 700; color: var(--bad); text-shadow: 0 0 6px var(--bg); pointer-events: none; }
  .pg.deleted { border-style: dashed; background: var(--bad-soft); }
  .pg.deleted .frame { opacity: .35; filter: grayscale(1); }
  .pg.deleted .gone { display: block; }
  .pg.deleted .pos { color: var(--faint); }
  .pg-loading { color: var(--muted); padding: 18px 2px; }

  .veil { position: fixed; inset: 0; background: color-mix(in srgb, var(--accent) 16%, transparent); backdrop-filter: blur(3px); display: none; place-items: center; z-index: 10; pointer-events: none; }
  .veil.on { display: grid; }
  .veil div { background: var(--surface); border: 2px dashed var(--accent); border-radius: 22px; padding: 38px 54px; font-size: 22px; font-weight: 700; box-shadow: var(--shadow); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-compress" viewBox="0 0 24 24"><path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/></symbol>

<div class="app">
  <aside class="rail" aria-label="Your documents">
    <div class="brand"><span class="mark"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><use href="#i-compress"/></svg></span><b>pdf<span>squeeze</span></b></div>
    <div class="offline" title="Files are processed on this computer and never uploaded.">Offline. Files never leave this computer.</div>
    <h2>Documents</h2>
    <ul class="docs" id="docs"></ul>
    <p class="norail" id="norail">Nothing here yet.</p>
    <button class="add" id="add" type="button"><svg class="i"><use href="#i-plus"/></svg>Add files</button>
    <input type="file" id="picker" multiple hidden>
  </aside>
  <main><div class="stage" id="view"></div></main>
</div>
<div class="veil" id="veil"><div>Drop to add your files</div></div>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const GRID_TOOL = "organize";

const CATS = [
  { id: "shrink", icon: "compress", label: "Shrink and fix", tools: ["compress", "repair", "check", "linearize", "pdfa"] },
  { id: "pages", icon: "organize", label: "Pages", tools: ["organize", "merge", "split", "extract"] },
  { id: "convert", icon: "to_images", label: "Convert", tools: ["to_images", "images_to_pdf", "text", "ocr"] },
  { id: "secure", icon: "protect", label: "Protect and clean", tools: ["protect", "unlock", "strip_metadata", "info"] },
  { id: "stamp", icon: "watermark", label: "Stamp", tools: ["watermark", "number_pages"] },
];
const TITLE = {
  compress: "Compress", repair: "Repair", check: "Check for problems", linearize: "Fast web view", pdfa: "Archive as PDF/A",
  merge: "Merge", split: "Split", extract: "Extract pages", organize: "Organize pages", delete: "Delete pages", reorder: "Reorder pages", rotate: "Rotate pages",
  to_images: "PDF to images", images_to_pdf: "Images to PDF", text: "Extract text", ocr: "Make searchable",
  protect: "Add a password", unlock: "Remove a password", strip_metadata: "Remove metadata", info: "Inspect",
  watermark: "Add a watermark", number_pages: "Number the pages", doctor: "Check setup",
};
const BLURB = {
  compress: "Make a file smaller, or fit a size limit.", repair: "Rebuild a damaged PDF.", check: "Look for structural problems.",
  linearize: "Let it start showing before it finishes downloading.", pdfa: "Convert for long-term storage.",
  merge: "Join several PDFs into one.", split: "Break a PDF into parts.", extract: "Keep only the pages you pick.", delete: "Remove pages you do not need.",
  organize: "Reorder, rotate and delete pages.", reorder: "Put pages in a new order.", rotate: "Turn pages clockwise.",
  to_images: "Save every page as a picture.", images_to_pdf: "Combine pictures into one PDF.", text: "Pull the words out of a PDF.",
  ocr: "Turn scans into text you can search and copy.",
  protect: "Lock it with strong encryption.", unlock: "Take a password off.", strip_metadata: "Remove author, title and edit history.",
  info: "Pages, encryption and document details.", watermark: "Stamp text across every page.", number_pages: "Add page numbers.",
  doctor: "See which engines are installed.",
};
// Fields the server decides itself (results folder, uploaded paths, password files).
const HIDDEN = new Set(["output", "out_dir", "tessdata", "password_file", "recursive"]);
const FILE_ARGS = new Set(["input", "inputs"]);
const PRIMARY = { compress: ["target_size"], ocr: ["lang"] };
const LABEL = { target_size: "Or fit under a size", lang: "Language", dpi: "Image resolution (dpi)", quality: "JPEG quality (1 to 100)",
  pages: "Which pages", order: "New order", angle: "Turn by (degrees)", every: "A new file every N pages", ranges: "Ranges", text: "Text",
  opacity: "Opacity (0 to 1)", size: "Font size", position: "Position", format: "Label", start: "First page number", part: "PDF/A part",
  first: "First page", last: "Last page", layout: "Keep the column layout", all: "Recognise every page, even ones with text", jobs: "Pages at once", angle_: "" };
const PLACEHOLDER = { target_size: "for example 2MB or 500KB", pages: "for example 1-3,7,z (z is the last page)", order: "for example 3,1,2",
  ranges: "for example 1-3,4-9", text: "for example CONFIDENTIAL", lang: "eng", format: "for example Page {n} of {total}" };

let tools = [], files = [], selected = new Set(), cat = "shrink", current = null, preset = "recommended";
let result = null, running = false, saved = {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ico = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const human = (n) => { if (n < 1024) return n + " B"; const u = ["KB", "MB", "GB"]; let i = -1; do { n /= 1024; i++; } while (n >= 1024 && i < 2); return (n < 10 ? n.toFixed(1) : Math.round(n)) + " " + u[i]; };
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Token": TOKEN, ...(opts.headers || {}) } });
  return r.json();
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

// A preview that cannot load becomes a plain document icon.
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img && img.tagName === "IMG" && img.closest(".thumb")) img.outerHTML = ico("doc");
}, true);

/* ---------- documents rail ---------- */
function renderDocs() {
  const ul = $("docs"); ul.innerHTML = "";
  for (const f of files) {
    const li = document.createElement("li");
    const on = selected.has(f.id);
    const thumb = (f.kind === "pdf" || f.kind === "image")
      ? `<img alt="" loading="lazy" src="/api/thumb?id=${encodeURIComponent(f.id)}&t=${encodeURIComponent(TOKEN)}">`
      : ico("doc");
    const detail = [f.pages ? plural(f.pages, "page") : null, human(f.size)].filter(Boolean).join(" · ");
    li.innerHTML = `<div class="doc" role="button" tabindex="0" aria-pressed="${on}" data-id="${esc(f.id)}" title="${esc(f.name)}">
        <div class="thumb">${thumb}</div>
        <div class="meta"><div class="n">${esc(f.name)}</div><div class="s">${esc(detail)}</div></div>
        <button class="x" type="button" aria-label="Remove ${esc(f.name)}" data-remove="${esc(f.id)}">${ico("close")}</button>
      </div>`;
    ul.appendChild(li);
  }
  $("norail").classList.toggle("hidden", files.length > 0);
}
$("docs").addEventListener("click", async (e) => {
  const rm = e.target.closest("[data-remove]");
  if (rm) {
    e.stopPropagation();
    await post("/api/remove", { id: rm.dataset.remove });
    files = files.filter((f) => f.id !== rm.dataset.remove); selected.delete(rm.dataset.remove);
    renderDocs(); render(); return;
  }
  const d = e.target.closest(".doc");
  if (d) { toggle(d.dataset.id); }
});
$("docs").addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("doc")) { e.preventDefault(); toggle(e.target.dataset.id); }
});
function toggle(id) { selected.has(id) ? selected.delete(id) : selected.add(id); renderDocs(); if (current) render(); }

async function refreshFiles() {
  const f = await api("/api/files");
  if (!f.ok) return;
  const known = new Set(files.map((x) => x.id));
  for (const x of f.files) if (!known.has(x.id)) selected.add(x.id);
  files = f.files;
  renderDocs(); render();
}
async function upload(list) {
  for (const file of list) {
    try {
      const j = await api("/api/upload?name=" + encodeURIComponent(file.name), { method: "POST", body: file });
      if (j.ok) { files.push(j.file); selected.add(j.file.id); renderDocs(); render(); }
      else showFatal(j.error);
    } catch (e) { showFatal({ code: "error", message: String(e) }); }
  }
}
const picker = $("picker");
$("add").addEventListener("click", () => picker.click());
picker.addEventListener("change", () => { upload([...picker.files]); picker.value = ""; });
// Browser-style drops (only used when running in a browser; the app window delivers real paths).
const veil = $("veil");
window.addEventListener("dragover", (e) => { e.preventDefault(); veil.classList.add("on"); });
window.addEventListener("dragleave", (e) => { if (!e.relatedTarget) veil.classList.remove("on"); });
window.addEventListener("drop", (e) => { e.preventDefault(); veil.classList.remove("on"); if (e.dataTransfer && e.dataTransfer.files.length) upload([...e.dataTransfer.files]); });
// Hooks the native window calls.
window.native = { filesChanged: refreshFiles, dragging: (on) => veil.classList.toggle("on", !!on) };

/* ---------- views ---------- */
function render() {
  const v = $("view");
  if (!files.length && !(current && current.name === "doctor")) { renderEmpty(v); return; }
  if (!current) current = tools.find((t) => t.name === "organize") || tools[0] || null;
  if (!current) { v.innerHTML = ""; return; }
  renderTask(v);
}

function sheetArt() {
  return `<svg class="art" viewBox="0 0 200 150" aria-hidden="true">
    <rect x="46" y="22" width="92" height="116" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="2" transform="rotate(-9 92 80)"/>
    <rect x="58" y="14" width="92" height="116" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="2" transform="rotate(4 104 72)"/>
    <rect x="56" y="18" width="92" height="116" rx="9" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
    <path d="M118 18h21a9 9 0 0 1 9 9v21z" fill="var(--accent-soft)"/>
    <rect x="70" y="52" width="48" height="6" rx="3" fill="var(--line)"/><rect x="70" y="68" width="62" height="6" rx="3" fill="var(--line)"/>
    <rect x="70" y="84" width="38" height="6" rx="3" fill="var(--line)"/>
    <circle cx="150" cy="116" r="19" fill="var(--accent)"/><path d="M150 107v18M141 116h18" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

function renderEmpty(v) {
  v.innerHTML = `<div class="hero empty">${sheetArt()}
      <h1>Drop a PDF to get started</h1>
      <p>Organize pages, compress, convert, make scans searchable and more. It all happens on this computer, and nothing is uploaded.</p>
      <div style="margin-top:14px"><button class="btn primary" id="choose" type="button">Choose files</button></div></div>
    <div class="foot"><span>Everything runs here. Close this window to stop.</span><button class="link" type="button" data-tool="doctor">${ico("doctor")} Check setup</button></div>`;
}

// Tools are clubbed into a few icon groups; picking a group shows its tools beside each other.
function toolbarHtml() {
  const have = new Set(tools.map((t) => t.name));
  const group = CATS.find((c) => c.tools.includes(current.name)) || null;
  if (group) cat = group.id;
  const groups = CATS.map((c) => `<button class="grp" type="button" data-cat="${c.id}" aria-pressed="${!!group && c.id === group.id}" title="${esc(c.label)}">
      ${ico(c.icon)}<span>${esc(c.label)}</span></button>`).join("");
  const subs = group ? group.tools.filter((n) => have.has(n)).map((n) => `<button class="sub" type="button" data-tool="${n}" aria-pressed="${n === current.name}" title="${esc(BLURB[n] || "")}">
      ${ico(n)}<span>${esc(TITLE[n] || n)}</span></button>`).join("") : "";
  return `<div class="toolbar"><nav class="grps" aria-label="Tool groups">${groups}</nav>
      <button class="grp icon-only" type="button" data-tool="doctor" aria-pressed="${current.name === "doctor"}" title="Check setup" aria-label="Check setup">${ico("doctor")}</button></div>
    ${subs ? `<nav class="subs" aria-label="${esc(group.label)} tools">${subs}</nav>` : ""}`;
}

function fileArgKey() { return Object.keys(current.input_schema.properties || {}).find((k) => FILE_ARGS.has(k)); }

function renderTask(v) {
  const props = current.input_schema.properties || {};
  const required = new Set(current.input_schema.required || []);
  const fk = fileArgKey();
  const multi = fk && props[fk].type === "array";
  const chosen = files.filter((f) => selected.has(f.id));
  let html = `${toolbarHtml()}
    <div class="task-head"><div><h1>${esc(TITLE[current.name] || current.name)}</h1><p>${esc(BLURB[current.name] || current.description)}</p></div></div>
    <div class="result top" id="result" aria-live="polite"></div>
    <div class="sheet"><form id="form" autocomplete="off" onsubmit="return false">`;

  if (fk) {
    if (!files.length) {
      html += `<div class="field"><div class="lbl">Files</div><div class="hint">Add a file first, using Add files on the left.</div></div>`;
    } else if (multi) {
      html += `<div class="field"><span class="lbl">Using</span><div class="using">${
        chosen.length ? chosen.map((f) => `<span class="chip">${ico("doc", "i")} ${esc(f.name)}</span>`).join("") : '<span class="hint">Pick documents on the left.</span>'}</div>
        ${current.name === "merge" ? '<div class="hint">Joined in the order they appear on the left.</div>' : ""}</div>`;
    } else {
      const opts = (chosen.length ? chosen : files).map((f) => `<option value="${esc(f.id)}">${esc(f.name)}</option>`).join("");
      html += `<div class="field"><label for="f_file">Document</label><select id="f_file">${opts}</select></div>`;
    }
  }

  if (current.name === "compress") {
    const P = [["low", "Light", "Best quality, smaller savings", [14, 17, 20, 22]], ["recommended", "Balanced", "Good for email and sharing", [10, 14, 17, 19]], ["extreme", "Smallest", "Screen quality, biggest savings", [5, 8, 11, 14]]];
    html += `<div class="field"><span class="lbl">How small?</span><div class="presets" id="presets">${P.map(([v2, t, d, b]) =>
      `<button type="button" class="preset" data-preset="${v2}" aria-pressed="${preset === v2}"><span class="bars">${b.map((h) => `<i style="height:${h}px"></i>`).join("")}</span><b>${t}</b><small>${d}</small></button>`).join("")}</div></div>`;
  }

  const skip = (k) => HIDDEN.has(k) || FILE_ARGS.has(k) || k === "level" || k === "password_file" || (current.name === GRID_TOOL && (k === "order" || k === "rotate"));
  const keys = Object.keys(props).filter((k) => !skip(k));
  const primary = PRIMARY[current.name] || [];
  const main = keys.filter((k) => required.has(k) || primary.includes(k));
  const extra = keys.filter((k) => !main.includes(k));
  if ("password_file" in props) {
    html += `<div class="field"><label for="f_password">Password</label><input id="f_password" type="password" autocomplete="new-password">
      <div class="hint">${current.name === "unlock" ? "Leave blank if the file only has editing restrictions." : "Keep it somewhere safe: it cannot be recovered."}</div></div>`;
  }
  if (current.name === GRID_TOOL) {
    html += `<div class="field"><span class="lbl">Pages</span>
      <div class="hint" style="margin:0 0 10px">Click pages to select them (Shift-click for a range), then use the icons. Drag a page, or a selection, to move it.</div>
      <div class="pg-bar" id="pgbar" hidden role="toolbar" aria-label="Page actions">
        <button class="ib" type="button" data-pgact="selall" title="Select all pages" aria-label="Select all pages"><svg class="i"><use href="#i-selall"/></svg></button>
        <button class="ib" type="button" data-pgact="selnone" title="Clear selection" aria-label="Clear selection"><svg class="i"><use href="#i-selnone"/></svg></button>
        <span class="sep" aria-hidden="true"></span>
        <button class="ib" type="button" data-pgact="left" title="Turn selected pages left" aria-label="Turn selected pages left"><svg class="i"><use href="#i-rotl"/></svg></button>
        <button class="ib" type="button" data-pgact="right" title="Turn selected pages right" aria-label="Turn selected pages right"><svg class="i"><use href="#i-rotate"/></svg></button>
        <button class="ib danger" type="button" data-pgact="del" id="pg-del" title="Remove selected pages" aria-label="Remove selected pages"><svg class="i"><use href="#i-delete"/></svg></button>
        <span class="sep" aria-hidden="true"></span>
        <button class="ib" type="button" data-pgact="reverse" title="Reverse the page order" aria-label="Reverse the page order"><svg class="i"><use href="#i-reorder"/></svg></button>
        <button class="ib" type="button" data-pgact="reset" title="Undo all changes" aria-label="Undo all changes"><svg class="i"><use href="#i-undo"/></svg></button>
        <span class="pg-sum" id="pgsum" aria-live="polite"></span></div>
      <div id="pagearea"><div class="pg-loading">Loading page previews…</div></div></div>`;
  }
  html += main.map((k) => fieldHtml(k, props[k], required.has(k))).join("");
  if (extra.length) html += `<details class="more"><summary>More options</summary><div class="inner">${extra.map((k) => fieldHtml(k, props[k], false)).join("")}</div></details>`;

  html += `<div class="runrow"><button class="btn primary" id="run" type="button" ${running ? "disabled" : ""}>${running ? "Working…" : "Run " + esc((TITLE[current.name] || "").toLowerCase())}</button>
      ${running ? '<div class="progwrap"><span class="progress" id="pbar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100"><i></i></span><div class="proglabel"><span id="plabel">Starting…</span><b id="ppct"></b></div></div>' : ""}</div></form></div>`;
  v.innerHTML = html;
  if (result) renderResult();
  document.querySelector("main").scrollTop = 0;
  if (current.name === GRID_TOOL) initPages();
}

function fieldHtml(key, p, required) {
  const label = LABEL[key] || key.replace(/_/g, " ");
  const req = required ? ' <span class="req" aria-hidden="true">*</span>' : "";

  const args = {};

  }
  if (current.name === "compress" && !args.target_size) args.level = preset;
  if (current.name === GRID_TOOL && pg.status === "ready") {
    const keep = pg.order.filter((n) => !pg.del.has(n));
    if (!keep.length) { result = { env: { ok: false, error: { code: "usage", message: "Every page is removed. Restore at least one page." } } }; renderResult(); return; }
    args.order = keep.join(",");
    const rot = keep.filter((n) => (pg.rot.get(n) || 0) % 360).map((n) => `${n}:${pg.rot.get(n) % 360}`);
    if (rot.length) args.rotate = rot.join(",");
  }
  const fileMap = {};
  if (fk) {

    if (multi) ids = files.filter((f) => selected.has(f.id)).map((f) => f.id);
    else { const sel = document.getElementById("f_file"); ids = sel && sel.value ? [sel.value] : []; }
    if (!ids.length) { result = { env: { ok: false, error: { code: "usage", message: "Add a document first, then try again." } } }; renderResult(); return; }
    fileMap[fk] = ids;
  }
  running = true; result = null; saved = {}; render();
  const poll = setInterval(pollProgress, 250);
  try {
    const pw = document.getElementById("f_password");
    const j = await post("/api/run", { tool: current.name, args, files: fileMap, password: pw ? pw.value : "" });
    result = j.envelope ? { env: j.envelope, downloads: j.downloads || [], used: fileMap[fk] || [] } : { env: { ok: false, error: j.error } };
  } catch (e) { result = { env: { ok: false, error: { code: "error", message: String(e) } } }; }

    const { info, ...rest } = r;
    body += kv({ pages: rest.pages, encrypted: rest.encrypted ? "yes" : "no", size: human(rest.size_bytes || 0), xmp_present: rest.xmp_present });
    if (info && Object.keys(info).length) body += `<h3 style="margin:18px 0 0;font-size:15px">Document details</h3>` + kv(info);
  } else if (env.command === "check" || env.command === "repair") {
    body += `<p style="margin:2px 0 0">${esc(SUMMARY[env.command](r))}</p>`;
    const msgs = r.messages || r.notes || [];
    if (msgs.length) body += `<pre class="raw">${esc(msgs.slice(0, 12).join("\n"))}</pre>`;
  } else if (SUMMARY[env.command]) {
    body += `<p style="margin:2px 0 0">${esc(SUMMARY[env.command](r))}</p>`;
  }
  const warns = (env.warnings || []).map((w) => `<div class="note">${esc(w)}</div>`).join("");
  const klass = partial ? "warn" : "good";
  const title = partial ? "Finished, with problems" : "Done";
  const actions = dls.length ? `<div class="actions" style="margin-top:16px">${dls.map(saveRow).join("")}</div>` : "";
  box.innerHTML = `<div class="banner ${klass}"><h2>${ico(partial ? "warn" : "ok")} ${title}</h2>${body}${actions}${warns}</div>`;
  // animate the bars from zero on the next frame
  requestAnimationFrame(() => requestAnimationFrame(() => box.querySelectorAll(".fill[data-w]").forEach((el) => { el.style.width = el.dataset.w + "%"; })));
}
async function saveFile(rel) {
  const j = await post("/api/save", { rel });
  if (j.ok) { saved[rel] = { path: j.path, folder: j.folder }; renderResult(); }
  else { result = { env: { ok: false, error: j.error } }; renderResult(); }
}
function showFatal(err) { result = { env: { ok: false, error: err } }; if (!current) { current = tools.find((t) => t.name === "doctor") || null; } render(); }

/* ---------- start ---------- */
(async function init() {
  try {
    const j = await api("/api/tools");
    if (!j.ok) throw new Error((j.error && j.error.message) || "could not load tools");
    tools = j.result.tools;
    await refreshFiles();
    render();
  } catch (e) {
    $("view").innerHTML = `<div class="banner bad"><h2>Could not start</h2><p>${esc(e.message || e)}</p></div>`;
  }
})();
</script>
</body>
